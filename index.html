<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>テニス ローテーション表ジェネレーター</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px 20px;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .form-section {
        padding: 30px 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
        font-size: 14px;
      }

      .form-group input[type="text"],
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s;
        font-family: inherit;
        background-color: white;
      }

      .form-group input[type="text"]:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 240px;
        line-height: 1.6;
      }

      .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 8px;
      }

      .radio-group label {
        display: flex;
        align-items: center;
        font-weight: 400;
        cursor: pointer;
      }

      .radio-group input[type="radio"] {
        margin-right: 6px;
        cursor: pointer;
      }

      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-row .form-group {
        flex: 1;
      }

      .form-help {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .result-section {
        display: none;
        padding: 30px 20px;
        background: #f8f9fa;
      }

      .result-section.show {
        display: block;
      }

      .result-title {
        text-align: center;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 600;
        color: #555;
      }

      .canvas-container {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
        overflow-y: auto;
        max-height: 80vh;
        -webkit-overflow-scrolling: touch;
      }

      #rotationCanvas {
        display: block;
        margin: 0 auto;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .btn-secondary {
        background: #6c757d;
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
      }

      .btn-secondary:hover {
        box-shadow: 0 6px 20px rgba(108, 117, 125, 0.6);
      }

      .error-message {
        background: #fee;
        color: #c33;
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      @media (max-width: 768px) {
        .container {
          max-width: 100%;
        }

        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
        }

        .header h1 {
          font-size: 20px;
        }

        .form-section {
          padding: 20px 15px;
        }

        .result-section {
          padding: 20px 15px;
        }
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #667eea;
      }

      .loading.show {
        display: block;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎾 テニス ローテーション表ジェネレーター</h1>
        <p>参加者と設定を入力して、対戦表を自動生成</p>
      </div>

      <div class="form-section">
        <div class="error-message" id="errorMessage"></div>

        <form id="rotationForm">
          <div class="form-group">
            <label for="title">大会名称（任意）</label>
            <input type="text" id="title" placeholder="例: 第1回テニス大会" />
          </div>

          <input type="hidden" name="matchType" value="doubles" />
          <div class="form-group">
            <label>試合形式</label>
            <div class="radio-group">
              <label>
                <input type="radio" name="matchType" value="doubles" checked />
                ダブルス
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="courtCount">コート数</label>
              <select id="courtCount" required>
                <option value="">選択してください</option>
                <option value="1" selected>1面</option>
                <option value="2">2面</option>
                <option value="3">3面</option>
                <option value="4">4面</option>
                <option value="5">5面</option>
              </select>
            </div>

            <div class="form-group">
              <label for="playerCount">参加人数</label>
              <select id="playerCount" required>
                <option value="">選択してください</option>
              </select>
              <div class="form-help" id="playerCountHelp"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="roundCount">ラウンド数</label>
              <select id="roundCount" required>
                <option value="5">5ラウンド</option>
                <option value="10">10ラウンド</option>
                <option value="15">15ラウンド</option>
                <option value="20" selected>20ラウンド</option>
                <option value="25">25ラウンド</option>
                <option value="30">30ラウンド</option>
                <option value="35">35ラウンド</option>
                <option value="40">40ラウンド</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="participants">参加者名（1行に1名、任意）</label>
            <textarea
              id="participants"
              placeholder="田中太郎&#10;鈴木花子&#10;佐藤次郎&#10;山田美咲&#10;&#10;※未入力の場合は番号で表示されます"
              lines="10"
            ></textarea>
            <div
              id="participantCount"
              style="
                margin-top: 5px;
                font-size: 13px;
                color: #667eea;
                font-weight: 600;
              "
            >
              ※ 0名が入力されています
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px">
              <button
                type="button"
                class="btn btn-secondary"
                id="formatBtn"
                style="padding: 8px 15px; font-size: 14px; flex: 1"
              >
                📝 名前を整形する
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                id="randomBtn"
                style="padding: 8px 15px; font-size: 14px; flex: 1"
              >
                🎲 ランダム順にする
              </button>
            </div>
            <div class="form-help" style="margin-top: 10px">
              ※整形ボタン：1行に複数の名前がある場合は分割し、先頭の番号を削除します。<br />
              ※ランダム順ボタン：参加者の順番をランダムに並べ替えます。<br />
              ※名前を入力すると「1.
              田中太郎」のように番号付きで表示されます。未入力の場合は番号（1、2、3...）のみ表示されます。
            </div>
          </div>

          <button type="submit" class="btn" id="generateBtn">
            ローテーション表を生成
          </button>
        </form>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>生成中...</p>
      </div>

      <div class="result-section" id="resultSection">
        <h2 class="result-title">生成された対戦表</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" id="newBtnTop">新規作成</button>
          <button class="btn" id="downloadBtnTop">画像を保存</button>
        </div>
        <div class="canvas-container">
          <canvas id="rotationCanvas"></canvas>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" id="newBtn">新規作成</button>
          <button class="btn" id="downloadBtn">画像を保存</button>
        </div>
      </div>
    </div>

    <script>
      // ローテーション生成クラス（Round Robin方式）
      class RotationGenerator {
        constructor(players, courtCount, matchType, roundCount = 10) {
          this.players = players;
          this.courtCount = parseInt(courtCount);
          this.matchType = matchType;
          this.roundCount = parseInt(roundCount);
          this.rounds = [];
          this.generateRotation();
        }

        // 公平なローテーションを生成（出場回数、対戦履歴、ペア履歴を追跡）
        // アルゴリズム：
        // 1. 出場回数が少ないプレイヤーを優先
        // 2. 対戦回数が少ない相手を選択
        // 3. ダブルスの場合はペア回数が少ない相手を選択
        // スコア計算：-(出場回数)*100 - (ペア回数)*50 - (対戦回数)*10
        generateRotation() {
          const playerCount = this.players.length;

          // 統計情報を初期化
          this.playCount = Array(playerCount).fill(0); // 出場回数
          this.matchHistory = Array(playerCount)
            .fill(null)
            .map(() => Array(playerCount).fill(0)); // 対戦履歴
          this.partnerHistory = Array(playerCount)
            .fill(null)
            .map(() => Array(playerCount).fill(0)); // ペア履歴

          this.generateDoublesRotation(playerCount, this.roundCount);
        }

        generateDoublesRotation(playerCount, maxRounds) {
          // ダブルスは最低4人必要
          if (playerCount < 4) {
            throw new Error("ダブルスには最低4人必要です");
          }

          for (let round = 0; round < maxRounds; round++) {
            const roundMatches = [];
            const usedInRound = new Set();

            // このラウンドで可能な限り試合を作成
            for (let court = 0; court < this.courtCount; court++) {
              const match = this.findBestDoublesMatch(playerCount, usedInRound);
              if (match) {
                roundMatches.push(match);
                usedInRound.add(match.t1p1);
                usedInRound.add(match.t1p2);
                usedInRound.add(match.t2p1);
                usedInRound.add(match.t2p2);

                // 統計更新
                this.playCount[match.t1p1]++;
                this.playCount[match.t1p2]++;
                this.playCount[match.t2p1]++;
                this.playCount[match.t2p2]++;

                // ペア履歴更新
                this.partnerHistory[match.t1p1][match.t1p2]++;
                this.partnerHistory[match.t1p2][match.t1p1]++;
                this.partnerHistory[match.t2p1][match.t2p2]++;
                this.partnerHistory[match.t2p2][match.t2p1]++;

                // 対戦履歴更新
                this.matchHistory[match.t1p1][match.t2p1]++;
                this.matchHistory[match.t1p1][match.t2p2]++;
                this.matchHistory[match.t1p2][match.t2p1]++;
                this.matchHistory[match.t1p2][match.t2p2]++;
                this.matchHistory[match.t2p1][match.t1p1]++;
                this.matchHistory[match.t2p1][match.t1p2]++;
                this.matchHistory[match.t2p2][match.t1p1]++;
                this.matchHistory[match.t2p2][match.t1p2]++;
              }
            }

            if (roundMatches.length > 0) {
              // スコアの高い順（より公平な組み合わせ順）にソート
              roundMatches.sort((a, b) => {
                const scoreA =
                  -(
                    this.playCount[a.t1p1] +
                    this.playCount[a.t1p2] +
                    this.playCount[a.t2p1] +
                    this.playCount[a.t2p2]
                  ) *
                    100 -
                  (this.partnerHistory[a.t1p1][a.t1p2] +
                    this.partnerHistory[a.t2p1][a.t2p2]) *
                    50 -
                  (this.matchHistory[a.t1p1][a.t2p1] +
                    this.matchHistory[a.t1p1][a.t2p2] +
                    this.matchHistory[a.t1p2][a.t2p1] +
                    this.matchHistory[a.t1p2][a.t2p2]) *
                    10;

                const scoreB =
                  -(
                    this.playCount[b.t1p1] +
                    this.playCount[b.t1p2] +
                    this.playCount[b.t2p1] +
                    this.playCount[b.t2p2]
                  ) *
                    100 -
                  (this.partnerHistory[b.t1p1][b.t1p2] +
                    this.partnerHistory[b.t2p1][b.t2p2]) *
                    50 -
                  (this.matchHistory[b.t1p1][b.t2p1] +
                    this.matchHistory[b.t1p1][b.t2p2] +
                    this.matchHistory[b.t1p2][b.t2p1] +
                    this.matchHistory[b.t1p2][b.t2p2]) *
                    10;

                return scoreB - scoreA;
              });

              const roundGroups = this.splitIntoCourts(
                roundMatches.map((m) => {
                  return {
                    team1: [this.players[m.t1p1], this.players[m.t1p2]],
                    team2: [this.players[m.t2p1], this.players[m.t2p2]],
                    type: "doubles",
                    stats: {
                      player1: {
                        name: this.players[m.t1p1],
                        playCount: this.playCount[m.t1p1],
                        partnerCount: this.partnerHistory[m.t1p1][m.t1p2],
                        matchCount1: this.matchHistory[m.t1p1][m.t2p1],
                        matchCount2: this.matchHistory[m.t1p1][m.t2p2],
                      },
                      player2: {
                        name: this.players[m.t1p2],
                        playCount: this.playCount[m.t1p2],
                        partnerCount: this.partnerHistory[m.t1p2][m.t1p1],
                        matchCount1: this.matchHistory[m.t1p2][m.t2p1],
                        matchCount2: this.matchHistory[m.t1p2][m.t2p2],
                      },
                      player3: {
                        name: this.players[m.t2p1],
                        playCount: this.playCount[m.t2p1],
                        partnerCount: this.partnerHistory[m.t2p1][m.t2p2],
                        matchCount1: this.matchHistory[m.t2p1][m.t1p1],
                        matchCount2: this.matchHistory[m.t2p1][m.t1p2],
                      },
                      player4: {
                        name: this.players[m.t2p2],
                        playCount: this.playCount[m.t2p2],
                        partnerCount: this.partnerHistory[m.t2p2][m.t2p1],
                        matchCount1: this.matchHistory[m.t2p2][m.t1p1],
                        matchCount2: this.matchHistory[m.t2p2][m.t1p2],
                      },
                    },
                  };
                })
              );
              this.rounds.push(...roundGroups);
            }
          }
        }

        findBestDoublesMatch(playerCount, usedInRound) {
          let bestMatch = null;
          let bestScore = -Infinity;

          // 出場回数が少ないプレイヤーから順に
          const availablePlayers = Array.from(
            { length: playerCount },
            (_, i) => i
          )
            .filter((i) => !usedInRound.has(i))
            .sort((a, b) => this.playCount[a] - this.playCount[b]);

          if (availablePlayers.length < 4) return null;

          // 4人のプレイヤーの全組み合わせを試す
          for (let i = 0; i < availablePlayers.length - 3; i++) {
            for (let j = i + 1; j < availablePlayers.length - 2; j++) {
              for (let k = j + 1; k < availablePlayers.length - 1; k++) {
                for (let l = k + 1; l < availablePlayers.length; l++) {
                  const p1 = availablePlayers[i];
                  const p2 = availablePlayers[j];
                  const p3 = availablePlayers[k];
                  const p4 = availablePlayers[l];

                  // 4人が決まったら、3通りのペア組み合わせパターンを評価
                  const patterns = [
                    { t1p1: p1, t1p2: p2, t2p1: p3, t2p2: p4 }, // (1,2) vs (3,4)
                    { t1p1: p1, t1p2: p3, t2p1: p2, t2p2: p4 }, // (1,3) vs (2,4)
                    { t1p1: p1, t1p2: p4, t2p1: p2, t2p2: p3 }, // (1,4) vs (2,3)
                  ];

                  // 各パターンのスコアを計算し、最適なパターンを選択
                  for (const pattern of patterns) {
                    const { t1p1, t1p2, t2p1, t2p2 } = pattern;

                    // スコア計算
                    // 1. 出場回数が少ないほど高スコア
                    const playScore =
                      -(
                        this.playCount[t1p1] +
                        this.playCount[t1p2] +
                        this.playCount[t2p1] +
                        this.playCount[t2p2]
                      ) * 100;

                    // 2. ペア回数が少ないほど高スコア（最も重要）
                    const partnerScore =
                      -(
                        this.partnerHistory[t1p1][t1p2] +
                        this.partnerHistory[t2p1][t2p2]
                      ) * 50;

                    // 3. 対戦回数が少ないほど高スコア
                    const matchScore =
                      -(
                        this.matchHistory[t1p1][t2p1] +
                        this.matchHistory[t1p1][t2p2] +
                        this.matchHistory[t1p2][t2p1] +
                        this.matchHistory[t1p2][t2p2]
                      ) * 10;

                    const score = playScore + partnerScore + matchScore;

                    if (score > bestScore) {
                      bestScore = score;
                      bestMatch = { t1p1, t1p2, t2p1, t2p2 };
                    }
                  }
                }
              }
            }
          }

          return bestMatch;
        }

        splitIntoCourts(matches) {
          const groups = [];
          for (let i = 0; i < matches.length; i += this.courtCount) {
            const courtMatches = matches.slice(i, i + this.courtCount);
            groups.push(courtMatches);
          }
          return groups;
        }

        getRounds() {
          return this.rounds;
        }
      }

      // Canvas描画クラス
      class RotationCanvas {
        constructor(rotation, title, matchType) {
          this.rotation = rotation;
          this.title = title;
          this.matchType = matchType;
          this.canvas = document.getElementById("rotationCanvas");
          this.ctx = this.canvas.getContext("2d");

          // ==========================================
          // 描画設定（ここで一括調整可能）
          // ==========================================
          this.config = {
            // レイアウトサイズ
            layout: {
              courtWidth: 540, // コート枠の幅
              courtHeight: 80, // コート枠の高さ
              courtLabelHeight: 20, // コート名ラベルの高さ
              courtGap: 15, // コート間の余白
              roundGap: 30, // ラウンド間の余白
              roundHeaderHeight: 55, // ラウンドヘッダーの高さ
              padding: 20, // 全体のパディング
              titleTopMargin: 50, // タイトル上部の余白
              baseTitleHeight: 100, // タイトル部の基本高さ
              legendHeight: 50, // 凡例の高さ
              legendMarginTop: 15, // 凡例上部余白
              legendMarginBottom: 20, // 凡例下部余白
              vsCircleRadius: 18, // VSマークの円の半径
            },

            // フォント設定
            fonts: {
              titleSize: 24, // タイトル文字サイズ
              titleFont: "bold 24px sans-serif",
              subTitleSize: 14, // サブタイトル文字サイズ
              subTitleFont: "14px sans-serif",
              roundHeaderSize: 16, // ラウンドヘッダー文字サイズ
              roundHeaderFont: "bold 16px sans-serif",
              courtLabelSize: 12, // コート名文字サイズ
              courtLabelFont: "bold 12px sans-serif",
              playerNameSize: 16, // プレイヤー名文字サイズ
              playerNameFont: "bold 16px sans-serif",
              statsSize: 12, // 統計情報文字サイズ（横並び）
              statsFont: "12px sans-serif",
              statsVerticalSize: 10, // 統計情報文字サイズ（縦並び）
              statsVerticalFont: "10px sans-serif",
              badgeNumberSize: 12, // バッジ番号文字サイズ
              badgeNumberFont: "bold 12px sans-serif",
              legendSize: 11, // 凡例文字サイズ
              legendFont: "11px sans-serif",
              legendTitleFont: "bold 11px sans-serif",
            },

            // 色設定
            colors: {
              // 背景色
              canvasBackground: "#FFFFFF",

              // タイトル
              titleGradientStart: "#7B9FE3",
              titleGradientEnd: "#5A7ACD",
              titleText: "#FFFFFF",
              titleShadow: "rgba(0, 0, 0, 0.2)",

              // ラウンドヘッダー
              roundHeaderBackground: "#FFE5F1",
              roundHeaderBorder: "#FFB6D9",
              roundHeaderText: "#FF69B4",

              // コート枠
              courtBackgrounds: [
                "#FFF0F5",
                "#F0F8FF",
                "#FFF5EE",
                "#F0FFF0",
                "#FFF0FF",
              ],
              courtBorder: "#FFB6D9",
              courtBorderWidth: 4,
              courtDividerDotted: "#FFB6D9",
              courtDividerSolid: "#FFB6D9",
              courtDividerWidth: 2,
              courtLabelText: "#FF69B4",

              // VSマーク
              vsBackground: "#FFE5F1",
              vsBorder: "#FFB6D9",
              vsText: "#FF69B4",

              // プレイヤー名・統計
              playerNameText: "#FF69B4",
              statsText: "#8B4789",

              // バッジ
              badgeBorder: "#FFFFFF",
              badgeBorderWidth: 2,
              badgeText: "#FFFFFF",
              badgeShadow: "rgba(0, 0, 0, 0.3)",

              // 凡例
              legendBackground: "#F8F9FA",
              legendBorder: "#E0E0E0",
              legendText: "#666",
              legendTitleText: "#555",
            },

            // バッジカラーパレット（視認性の良い20色）
            badgeColors: [
              "#FF6B6B",
              "#4ECDC4",
              "#45B7D1",
              "#FFA07A",
              "#98D8C8",
              "#F7DC6F",
              "#BB8FCE",
              "#85C1E2",
              "#F8B500",
              "#52B788",
              "#E74C3C",
              "#3498DB",
              "#9B59B6",
              "#1ABC9C",
              "#F39C12",
              "#E91E63",
              "#00BCD4",
              "#8BC34A",
              "#FF9800",
              "#607D8B",
            ],

            // その他
            other: {
              badgeSize: 24, // バッジの直径
              badgeSpacing: 12, // バッジ下の余白
              playerNameSpacing: 24, // プレイヤー名下の余白
              statsLineHeight: 13, // 統計情報の行間（縦並び）
              statsEdgeMargin: 5, // 統計情報の端からの余白
              boxShadowBlur: 12, // コート枠の影のぼかし
              boxShadowOffset: 6, // コート枠の影のオフセット
              boxShadowColor: "rgba(255, 182, 217, 0.3)",
            },
          };

          // 後方互換性のため、直接プロパティとしても参照可能にする
          this.courtWidth = this.config.layout.courtWidth;
          this.courtHeight = this.config.layout.courtHeight;
          this.courtLabelHeight = this.config.layout.courtLabelHeight;
          this.courtGap = this.config.layout.courtGap;
          this.roundGap = this.config.layout.roundGap;
          this.padding = this.config.layout.padding;
          this.baseTitleHeight = this.config.layout.baseTitleHeight;
          this.titleHeight = this.baseTitleHeight;
          this.badgeColors = this.config.badgeColors;

          // コート毎の背景色をランダムに生成（全ラウンドで同じコートは同じ色）
          // 隣接するコートは異なる色になるようにシャッフルしてから順番に割り当て
          const courtBgColors = [
            "#FFF0F5",
            "#F0F8FF",
            "#FFF5EE",
            "#F0FFF0",
            "#FFF0FF",
            "#FFE4E1",
            "#F0FFFF",
            "#FFF8DC",
            "#F5F5DC",
            "#FFFACD",
          ];

          // Fisher-Yatesアルゴリズムでシャッフル
          const shuffledColors = [...courtBgColors];
          for (let i = shuffledColors.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledColors[i], shuffledColors[j]] = [
              shuffledColors[j],
              shuffledColors[i],
            ];
          }

          const courtCount = this.rotation.courtCount;
          this.courtColors = Array(courtCount)
            .fill(null)
            .map((_, index) => shuffledColors[index % shuffledColors.length]);

          this.setupCanvas();
        }

        setupCanvas() {
          const rounds = this.rotation.getRounds();

          // 縦長レイアウト：幅は固定、高さは動的に計算
          this.canvasWidth = this.courtWidth + this.padding * 2;

          // 高さの計算：各ラウンドのコート数に応じて
          let totalHeight =
            this.padding + this.config.layout.titleTopMargin + this.titleHeight;

          // アイコン凡例の高さを追加
          totalHeight += 15 + 50 + 20; // 上余白 + 凡例高さ + 下余白

          rounds.forEach((round) => {
            totalHeight += 55; // ラウンドヘッダー（実際のdrawRotationと一致させる）
            totalHeight +=
              round.length * (this.courtLabelHeight + this.courtHeight); // 各コートの高さ（コート名 + 本体）
            totalHeight += (round.length - 1) * this.courtGap; // コート間の余白
            totalHeight += this.roundGap; // ラウンド後の余白
          });

          totalHeight += this.padding; // 最後のパディング

          this.canvasHeight = totalHeight;

          // 高DPI対応
          const dpr = window.devicePixelRatio || 1;
          this.canvas.width = this.canvasWidth * dpr;
          this.canvas.height = this.canvasHeight * dpr;
          this.canvas.style.width = this.canvasWidth + "px";
          this.canvas.style.height = this.canvasHeight + "px";

          this.ctx.scale(dpr, dpr);
        }

        draw() {
          // 背景
          this.ctx.fillStyle = "#ffffff";
          this.ctx.fillRect(0, 0, this.canvasWidth, this.canvasHeight);

          // タイトル描画
          this.drawTitle();

          // ローテーション描画
          this.drawRotation();
        }

        drawTitle() {
          // タイトルの長さに応じて改行して行数を計算
          const titleText = this.title || "ローテーション表";
          const maxWidth = this.canvasWidth - this.padding * 4;

          // 一時的にフォントを設定してテキスト測定
          this.ctx.font = "bold 24px sans-serif";
          const lines = this.wrapText(
            titleText,
            maxWidth,
            "bold 24px sans-serif"
          );

          const lineHeight = 28;
          const additionalHeight = Math.max(0, (lines.length - 1) * lineHeight);
          this.titleHeight = this.baseTitleHeight + additionalHeight;

          const titleTopMargin = this.config.layout.titleTopMargin;

          // タイトル背景（可愛いパステルグラデーション）
          const gradient = this.ctx.createLinearGradient(
            0,
            this.padding + titleTopMargin,
            0,
            titleTopMargin + this.titleHeight
          );
          gradient.addColorStop(0, "#7B9FE3");
          gradient.addColorStop(1, "#5A7ACD");

          this.ctx.fillStyle = gradient;
          // 角丸の背景
          this.roundRect(
            this.padding,
            this.padding + titleTopMargin,
            this.canvasWidth - this.padding * 2,
            this.titleHeight - this.padding,
            15
          );
          this.ctx.fill();

          // タイトルテキスト
          this.ctx.fillStyle = "#ffffff";
          this.ctx.font = "bold 24px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          // テキストに影をつける
          this.ctx.shadowColor = "rgba(0, 0, 0, 0.2)";
          this.ctx.shadowBlur = 3;
          this.ctx.shadowOffsetX = 1;
          this.ctx.shadowOffsetY = 1;

          const startY = this.padding + titleTopMargin + 25;

          lines.forEach((line, index) => {
            this.ctx.fillText(
              line,
              this.canvasWidth / 2,
              startY + index * lineHeight
            );
          });

          // サブタイトル
          this.ctx.font = "14px sans-serif";
          this.ctx.fillText(
            `ダブルス 対戦表 ✨`,
            this.canvasWidth / 2,
            this.padding + titleTopMargin + 55 + additionalHeight
          );
          this.ctx.shadowColor = "transparent";
        }

        drawRotation() {
          const rounds = this.rotation.getRounds();
          let currentY =
            this.padding + this.config.layout.titleTopMargin + this.titleHeight;

          rounds.forEach((round, roundIndex) => {
            // 第1ラウンドの前にアイコン凡例を表示
            if (roundIndex === 0) {
              currentY += 15; // 余白
              const legendHeight = this.drawLegend(currentY);
              currentY += legendHeight + 20; // 凡例の高さ + 余白
            }

            // ラウンドヘッダー
            this.drawRoundHeader(currentY, roundIndex + 1);
            currentY += 55; // ヘッダーの高さ分進める（コート名と被らないように余白を確保）

            // 各コートの試合を縦に並べる
            round.forEach((match, courtIndex) => {
              const courtX = this.padding; // 常に左端から
              this.drawMatch(courtX, currentY, match, courtIndex, roundIndex);
              currentY +=
                this.courtLabelHeight + this.courtHeight + this.courtGap; // コート名 + 本体 + 次のコートの位置へ
            });

            // 最後のコートの余白を調整し、ラウンド間の余白を追加
            currentY = currentY - this.courtGap + this.roundGap;
          });
        }

        drawLegend(y) {
          // アイコンの説明を表示
          const legendHeight = 50;
          const legendY = y;

          // 背景
          this.ctx.fillStyle = "#F8F9FA";
          this.roundRect(
            this.padding,
            legendY,
            this.canvasWidth - this.padding * 2,
            legendHeight,
            10
          );
          this.ctx.fill();

          // 枠線
          this.ctx.strokeStyle = "#E0E0E0";
          this.ctx.lineWidth = 1;
          this.roundRect(
            this.padding,
            legendY,
            this.canvasWidth - this.padding * 2,
            legendHeight,
            10
          );
          this.ctx.stroke();

          // タイトル
          this.ctx.fillStyle = "#555";
          this.ctx.font = "bold 14px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "top";
          this.ctx.fillText(
            "アイコンの説明",
            this.canvasWidth / 2,
            legendY + 8
          );

          // アイコン説明（横並び）
          this.ctx.font = "15px sans-serif";
          this.ctx.fillStyle = "#666";
          const iconY = legendY + 28;
          const spacing = (this.canvasWidth - this.padding * 2) / 3;

          // 🎾 出場
          this.ctx.textAlign = "center";
          this.ctx.fillText("🎾 出場回数", this.padding + spacing / 2, iconY);

          // 👫 ペア（ダブルスのみ）
          if (this.matchType === "doubles") {
            this.ctx.fillText(
              "👫 ペア回数",
              this.padding + spacing * 1.5,
              iconY
            );
          }

          // ⚔️ 対戦
          this.ctx.fillText("⚔️ 対戦回数", this.padding + spacing * 2.5, iconY);

          return legendHeight;
        }

        drawRoundHeader(y, roundNumber) {
          // 可愛い背景バッジ
          const badgeWidth = 180;
          const badgeHeight = 30;
          const badgeX = (this.canvasWidth - badgeWidth) / 2;

          this.ctx.fillStyle = "#FFE5F1";
          this.roundRect(badgeX, y, badgeWidth, badgeHeight, 15);
          this.ctx.fill();

          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 2;
          this.roundRect(badgeX, y, badgeWidth, badgeHeight, 15);
          this.ctx.stroke();

          this.ctx.fillStyle = "#FF69B4";
          this.ctx.font = "bold 16px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          this.ctx.fillText(
            `★ 第${roundNumber}ラウンド ★`,
            this.canvasWidth / 2,
            y + badgeHeight / 2
          );
        }

        drawMatch(x, y, match, courtIndex, roundIndex) {
          // ボックスの柔らかい影（強調）
          this.ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
          this.ctx.shadowBlur = 8;
          this.ctx.shadowOffsetX = 2;
          this.ctx.shadowOffsetY = 4;

          // ボックス背景（コート毎に同じ色）
          this.ctx.fillStyle = this.courtColors[courtIndex];
          this.roundRect(x, y, this.courtWidth, this.courtHeight, 12);
          this.ctx.fill();

          // ボックス枠線（可愛いカラー）
          this.ctx.shadowColor = "transparent";
          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 3;
          this.roundRect(x, y, this.courtWidth, this.courtHeight, 12);
          this.ctx.stroke();

          this.drawDoublesMatch(x, y, match, courtIndex);
        }

        drawDoublesMatch(x, y, match, courtIndex) {
          // 4枠レイアウト（1×4グリッド）
          const cellWidth = this.courtWidth / 4;
          const cellHeight = this.courtHeight;

          // 縦の仕切り線
          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([5, 5]);

          // 左から1本目の縦線（点線）
          this.ctx.beginPath();
          this.ctx.moveTo(x + cellWidth, y);
          this.ctx.lineTo(x + cellWidth, y + this.courtHeight);
          this.ctx.stroke();

          // 左から2本目の縦線（実線）
          this.ctx.setLineDash([]);
          this.ctx.beginPath();
          this.ctx.moveTo(x + cellWidth * 2, y);
          this.ctx.lineTo(x + cellWidth * 2, y + this.courtHeight);
          this.ctx.stroke();
          this.ctx.setLineDash([5, 5]);

          // 左から3本目の縦線（点線）
          this.ctx.beginPath();
          this.ctx.moveTo(x + cellWidth * 3, y);
          this.ctx.lineTo(x + cellWidth * 3, y + this.courtHeight);
          this.ctx.stroke();

          this.ctx.setLineDash([]);

          // コート名（4枠の外側・上部）
          const courtLabel = String.fromCharCode(65 + courtIndex);
          this.ctx.fillStyle = "#FF69B4";
          this.ctx.font = "bold 12px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "bottom";
          this.ctx.fillText(
            `コート${courtLabel}`,
            x + this.courtWidth / 2,
            y - 5
          );

          // VS マーク（中央、可愛いスタイル）- 先に描画
          const vsX = x + this.courtWidth / 2;
          const vsY = y + this.courtHeight / 2;

          // 背景の円
          this.ctx.fillStyle = "#FFE5F1";
          this.ctx.beginPath();
          this.ctx.arc(vsX, vsY, 18, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 2;
          this.ctx.beginPath();
          this.ctx.arc(vsX, vsY, 18, 0, Math.PI * 2);
          this.ctx.stroke();

          this.ctx.fillStyle = "#FF69B4";
          this.ctx.font = "bold 14px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          this.ctx.fillText("VS", vsX, vsY);

          // プレイヤー1（左端） - 枚内左側に統計
          this.drawPlayerStats(
            x + cellWidth / 2,
            y + 5,
            match.stats.player1.name,
            match.stats.player1.playCount,
            match.stats.player1.partnerCount,
            [match.stats.player1.matchCount1, match.stats.player1.matchCount2],
            cellWidth - 10,
            "left",
            x // 枚の左端位置
          );

          // プレイヤー2（左から2番目） - 枚内左側に統計
          this.drawPlayerStats(
            x + cellWidth + cellWidth / 2,
            y + 5,
            match.stats.player2.name,
            match.stats.player2.playCount,
            match.stats.player2.partnerCount,
            [match.stats.player2.matchCount1, match.stats.player2.matchCount2],
            cellWidth - 10,
            "left",
            x + cellWidth // 枚の左端位置
          );

          // プレイヤー3（左から3番目） - 枚内右側に統計
          this.drawPlayerStats(
            x + cellWidth * 2 + cellWidth / 2,
            y + 5,
            match.stats.player3.name,
            match.stats.player3.playCount,
            match.stats.player3.partnerCount,
            [match.stats.player3.matchCount1, match.stats.player3.matchCount2],
            cellWidth - 10,
            "right",
            x + cellWidth * 3 // 枚の右端位置
          );

          // プレイヤー4（右端） - 枚内右側に統計
          this.drawPlayerStats(
            x + cellWidth * 3 + cellWidth / 2,
            y + 5,
            match.stats.player4.name,
            match.stats.player4.playCount,
            match.stats.player4.partnerCount,
            [match.stats.player4.matchCount1, match.stats.player4.matchCount2],
            cellWidth - 10,
            "right",
            x + cellWidth * 4 // 枚の右端位置
          );
        }

        drawPlayerStats(
          x,
          y,
          name,
          playCount,
          partnerCount,
          matchCount,
          maxWidth,
          statsAlign = null,
          cellEdgeX = null
        ) {
          // プレイヤー番号と名前を分離
          const nameMatch = name.match(/^(\d+)\.\s*(.+)$/);
          let playerNumber = null;
          let playerName = name;

          if (nameMatch) {
            playerNumber = nameMatch[1];
            playerName = nameMatch[2];
          } else if (/^\d+$/.test(name)) {
            // 番号のみの場合
            playerNumber = name;
            playerName = "";
          }

          // 3行レイアウト：バッジ → プレイヤー名 → 統計情報
          let currentY = y;

          // 1行目：プレイヤー番号バッジ
          if (playerNumber) {
            const badgeSize = 24;
            const badgeX = x;
            let badgeY;

            // プレイヤー名がない場合は縦横中央に配置
            if (!playerName) {
              badgeY = y + this.courtHeight / 2 - 8;
            } else {
              badgeY = currentY + badgeSize / 2 + 2;
            }

            // バッジに影を追加
            this.ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
            this.ctx.shadowBlur = 4;
            this.ctx.shadowOffsetX = 2;
            this.ctx.shadowOffsetY = 2;

            // バッジ背景（プレイヤー番号に基づいた色）
            this.ctx.fillStyle = this.getBadgeColor(playerNumber);
            this.ctx.beginPath();
            this.ctx.arc(badgeX, badgeY, badgeSize / 2, 0, Math.PI * 2);
            this.ctx.fill();

            // 影をリセット
            this.ctx.shadowColor = "transparent";
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetX = 0;
            this.ctx.shadowOffsetY = 0;

            // バッジ枠線
            this.ctx.strokeStyle = "#FFFFFF";
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(badgeX, badgeY, badgeSize / 2, 0, Math.PI * 2);
            this.ctx.stroke();

            // 番号テキスト（影付き）
            this.ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
            this.ctx.shadowBlur = 2;
            this.ctx.shadowOffsetX = 1;
            this.ctx.shadowOffsetY = 1;

            this.ctx.fillStyle = "#FFFFFF";
            this.ctx.font = "bold 12px sans-serif";
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "middle";
            this.ctx.fillText(playerNumber, badgeX, badgeY);

            // 影をリセット
            this.ctx.shadowColor = "transparent";
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetX = 0;
            this.ctx.shadowOffsetY = 0;

            // プレイヤー名がある場合のみcurrentYを更新
            if (playerName) {
              currentY += badgeSize + 8;
            }
          }

          // 2行目：プレイヤー名（あれば、中央揃え）
          if (playerName) {
            // 影を追加（深く）
            this.ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            this.ctx.shadowBlur = 2;
            this.ctx.shadowOffsetX = 1;
            this.ctx.shadowOffsetY = 1;

            // プレイヤー番号バッジの背景色と同じ色を使用
            this.ctx.fillStyle = this.getBadgeColor(playerNumber);
            this.ctx.font = "bold 20px sans-serif";
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "top";
            this.ctx.fillText(
              this.truncateText(playerName, maxWidth),
              x,
              currentY
            );

            // 影をリセット
            this.ctx.shadowColor = "transparent";
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetX = 0;
            this.ctx.shadowOffsetY = 0;

            currentY += 24;
          }

          // 3行目：統計情報
          // statsAlignが指定されている場合は枚内の左/右に横並びで表示
          if (playCount !== null && playCount !== undefined) {
            if (statsAlign && cellEdgeX !== null) {
              // 横並び表示（ダブルス用） - 左下または右下に配置
              this.ctx.font = "12px sans-serif";
              this.ctx.fillStyle = "#8B4789";
              this.ctx.textBaseline = "bottom";
              this.ctx.textAlign = statsAlign;

              const statsX =
                statsAlign === "left" ? cellEdgeX + 5 : cellEdgeX - 5;
              const bottomMargin = 10; // 下からの余白
              const statsY = y + this.courtHeight - bottomMargin;

              // 統計情報を横並びで表示
              const stats = [];
              stats.push(`🎾${playCount}`);
              stats.push(`👫${partnerCount}`);
              stats.push(`⚔️${matchCount[0]},${matchCount[1]}`);
              const statsText = stats.join(" ");

              this.ctx.fillText(statsText, statsX, statsY);
            } else {
              // 横並び表示（シングルス用）
              this.ctx.fillStyle = "#8B4789";
              this.ctx.font = "12px sans-serif";
              this.ctx.textAlign = "center";
              this.ctx.textBaseline = "top";

              const stats = [];

              // 出場
              stats.push(`🎾${playCount}`);

              // ペア（ダブルスの場合のみ）
              if (partnerCount !== null && partnerCount !== undefined) {
                stats.push(`👫${partnerCount}`);
              }

              // 対戦
              if (Array.isArray(matchCount)) {
                stats.push(`⚔️${matchCount[0]},${matchCount[1]}`);
              } else {
                stats.push(`⚔️${matchCount}`);
              }

              // 横並びで表示
              const statsText = stats.join(" ");
              this.ctx.fillText(statsText, x, currentY);
            }
          }
        }

        // プレイヤー番号に基づいてバッジ色を取得
        getBadgeColor(playerNumber) {
          const num = parseInt(playerNumber);
          if (isNaN(num)) return this.badgeColors[0];
          return this.badgeColors[(num - 1) % this.badgeColors.length];
        }

        // 角丸矩形を描画するヘルパーメソッド
        roundRect(x, y, width, height, radius) {
          this.ctx.beginPath();
          this.ctx.moveTo(x + radius, y);
          this.ctx.lineTo(x + width - radius, y);
          this.ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
          this.ctx.lineTo(x + width, y + height - radius);
          this.ctx.quadraticCurveTo(
            x + width,
            y + height,
            x + width - radius,
            y + height
          );
          this.ctx.lineTo(x + radius, y + height);
          this.ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
          this.ctx.lineTo(x, y + radius);
          this.ctx.quadraticCurveTo(x, y, x + radius, y);
          this.ctx.closePath();
        }

        // テキストを指定幅で改行するヘルパーメソッド
        wrapText(text, maxWidth, font) {
          this.ctx.font = font;
          const words = text.split("");
          const lines = [];
          let currentLine = "";

          for (let i = 0; i < words.length; i++) {
            const testLine = currentLine + words[i];
            const metrics = this.ctx.measureText(testLine);

            if (metrics.width > maxWidth && currentLine.length > 0) {
              lines.push(currentLine);
              currentLine = words[i];
            } else {
              currentLine = testLine;
            }
          }

          if (currentLine.length > 0) {
            lines.push(currentLine);
          }

          return lines;
        }

        truncateText(text, maxWidth) {
          const metrics = this.ctx.measureText(text);
          if (metrics.width <= maxWidth) {
            return text;
          }

          let truncated = text;
          while (
            this.ctx.measureText(truncated + "...").width > maxWidth &&
            truncated.length > 0
          ) {
            truncated = truncated.slice(0, -1);
          }
          return truncated + "...";
        }

        toDataURL() {
          return this.canvas.toDataURL("image/png", 1.0);
        }
      }

      // UIコントローラー
      class UIController {
        constructor() {
          this.form = document.getElementById("rotationForm");
          this.titleInput = document.getElementById("title");
          this.playerCountSelect = document.getElementById("playerCount");
          this.courtCountSelect = document.getElementById("courtCount");
          this.roundCountSelect = document.getElementById("roundCount");
          this.participantsInput = document.getElementById("participants");
          this.participantCount = document.getElementById("participantCount");
          this.generateBtn = document.getElementById("generateBtn");
          this.formatBtn = document.getElementById("formatBtn");
          this.randomBtn = document.getElementById("randomBtn");
          this.newBtn = document.getElementById("newBtn");
          this.newBtnTop = document.getElementById("newBtnTop");
          this.downloadBtn = document.getElementById("downloadBtn");
          this.downloadBtnTop = document.getElementById("downloadBtnTop");
          this.resultSection = document.getElementById("resultSection");
          this.errorMessage = document.getElementById("errorMessage");
          this.loading = document.getElementById("loading");

          this.currentCanvas = null;

          this.bindEvents();
          this.updatePlayerCountOptions(); // 初期化時に参加人数オプションを設定

          // デフォルトタイトルを設定（年始からの日数を計算）
          this.setDefaultTitle();

          // デフォルト値を設定（ダブルス、6人、1コート）
          setTimeout(() => {
            if (this.playerCountSelect.querySelector('option[value="6"]')) {
              this.playerCountSelect.value = "6";
            }
          }, 0);
        }

        setDefaultTitle() {
          const today = new Date();
          const startOfYear = new Date(today.getFullYear(), 0, 1);
          const dayOfYear =
            Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
          this.titleInput.value = `第${dayOfYear}回 フレームショット選手権`;
        }

        bindEvents() {
          this.form.addEventListener("submit", (e) => {
            e.preventDefault();
            this.generateRotation();
          });

          this.formatBtn.addEventListener("click", () => {
            this.formatParticipants();
          });

          this.randomBtn.addEventListener("click", () => {
            this.randomizeParticipants();
          });

          this.newBtn.addEventListener("click", () => {
            this.resetForm();
          });

          this.newBtnTop.addEventListener("click", () => {
            this.resetForm();
          });

          this.downloadBtn.addEventListener("click", () => {
            this.downloadImage();
          });

          this.downloadBtnTop.addEventListener("click", () => {
            this.downloadImage();
          });

          // コート数が変更されたら参加人数の選択肢を更新
          this.courtCountSelect.addEventListener("change", () => {
            this.updatePlayerCountOptions();
          });

          // 参加者名入力時に人数を表示
          this.participantsInput.addEventListener("input", () => {
            this.updateParticipantCount();
          });

          // 参加人数選択時にも警告チェック
          this.playerCountSelect.addEventListener("change", () => {
            this.updateParticipantCount();
          });
        }

        updateParticipantCount() {
          const text = this.participantsInput.value;
          const names = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line.length > 0);

          const count = names.length;
          const selectedCount = parseInt(this.playerCountSelect.value) || 0;

          if (count === 0) {
            this.participantCount.textContent = "※ 0名が入力されています";
            this.participantCount.style.color = "#999";
            this.participantCount.style.backgroundColor = "transparent";
            this.participantCount.style.fontWeight = "normal";
          } else if (selectedCount > 0 && count !== selectedCount) {
            // 警告表示
            if (count > selectedCount) {
              this.participantCount.textContent = `⚠️ ${count}名が入力されています（参加人数: ${selectedCount}名）最初の${selectedCount}名のみ使用されます`;
            } else {
              this.participantCount.textContent = `⚠️ ${count}名が入力されています（参加人数: ${selectedCount}名）不足分は番号で補完されます`;
            }
            this.participantCount.style.color = "#ff6b6b";
            this.participantCount.style.backgroundColor = "#ffe5e5";
            this.participantCount.style.fontWeight = "bold";
            this.participantCount.style.padding = "8px";
            this.participantCount.style.borderRadius = "4px";
          } else {
            this.participantCount.textContent = `✓ ${count}名が入力されています`;
            this.participantCount.style.color = "#667eea";
            this.participantCount.style.backgroundColor = "transparent";
            this.participantCount.style.fontWeight = "normal";
            this.participantCount.style.padding = "0";
          }
        }

        updatePlayerCountOptions() {
          const courtCount = parseInt(this.courtCountSelect.value) || 1;
          const currentValue = this.playerCountSelect.value;
          const helpText = document.getElementById("playerCountHelp");

          // 既存のオプションをクリア
          this.playerCountSelect.innerHTML =
            '<option value="">選択してください</option>';

          let minPlayers;
          let maxPlayers = 30;

          // ダブルス：1コートあたり最低4名
          minPlayers = Math.max(4, courtCount * 4);

          for (let i = minPlayers; i <= maxPlayers; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = `${i}人`;
            this.playerCountSelect.appendChild(option);
          }
          helpText.textContent = `※最低${minPlayers}人（${courtCount}コート×4名）`;

          // 以前選択されていた値が新しいオプションに存在する場合は復元
          if (
            currentValue &&
            this.playerCountSelect.querySelector(
              `option[value="${currentValue}"]`
            )
          ) {
            this.playerCountSelect.value = currentValue;
          }
        }

        showError(message) {
          this.errorMessage.textContent = message;
          this.errorMessage.classList.add("show");
          setTimeout(() => {
            this.errorMessage.classList.remove("show");
          }, 5000);
        }

        showLoading(show) {
          if (show) {
            this.loading.classList.add("show");
            this.generateBtn.disabled = true;
          } else {
            this.loading.classList.remove("show");
            this.generateBtn.disabled = false;
          }
        }

        formatParticipants() {
          const text = this.participantsInput.value;
          if (!text.trim()) {
            this.showError("整形する名前を入力してください");
            return;
          }

          // 1. 改行、タブ、カンマ、スペース（全角・半角）で分割
          const separators = /[\n\r\t,、\s　]+/;
          let names = text
            .split(separators)
            .map((name) => name.trim())
            .filter((name) => name.length > 0);

          // 2. 各名前から先頭の番号を削除
          //    パターン: "1." "1)" "1 " "①" など
          names = names
            .map((name) => {
              // 半角数字 + 区切り文字（. ) : など）を削除
              let formatted = name.replace(/^\d+[.):：)）]\s*/, "");
              // 全角数字 + 区切り文字を削除
              formatted = formatted.replace(/^[０-９]+[.):：)）]\s*/, "");
              // 丸数字を削除（①②③...）
              formatted = formatted.replace(/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]\s*/, "");
              // 括弧付き数字を削除（(1) (2) ...）
              formatted = formatted.replace(/^\(\d+\)\s*/, "");
              formatted = formatted.replace(/^（\d+）\s*/, "");
              return formatted.trim();
            })
            .filter((name) => name.length > 0);

          // 3. 重複を削除
          names = [...new Set(names)];

          // 4. 整形結果をテキストエリアに反映
          this.participantsInput.value = names.join("\n");

          // 参加者数を更新
          this.updateParticipantCount();

          // 5. 成功メッセージ（エラーメッセージの代わりに使用）
          const originalError = this.errorMessage.style.backgroundColor;
          this.errorMessage.style.backgroundColor = "#e8f5e9";
          this.errorMessage.style.color = "#2e7d32";
          this.errorMessage.textContent = `✓ ${names.length}名の名前を整形しました`;
          this.errorMessage.classList.add("show");
          setTimeout(() => {
            this.errorMessage.classList.remove("show");
            setTimeout(() => {
              this.errorMessage.style.backgroundColor = originalError;
              this.errorMessage.style.color = "#c33";
            }, 300);
          }, 2000);
        }

        randomizeParticipants() {
          const text = this.participantsInput.value;
          if (!text.trim()) {
            this.showError("ランダムにする名前を入力してください");
            return;
          }

          // 名前を取得
          let names = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line.length > 0);

          if (names.length < 2) {
            this.showError("ランダムにするには2名以上必要です");
            return;
          }

          // Fisher-Yates シャッフルアルゴリズム
          for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
          }

          // ランダム順をテキストエリアに反映
          this.participantsInput.value = names.join("\n");

          // 参加者数を更新
          this.updateParticipantCount();

          // 成功メッセージ
          const originalError = this.errorMessage.style.backgroundColor;
          this.errorMessage.style.backgroundColor = "#e8f5e9";
          this.errorMessage.style.color = "#2e7d32";
          this.errorMessage.textContent = `✓ ${names.length}名をランダム順に並べ替えました`;
          this.errorMessage.classList.add("show");
          setTimeout(() => {
            this.errorMessage.classList.remove("show");
            setTimeout(() => {
              this.errorMessage.style.backgroundColor = originalError;
              this.errorMessage.style.color = "#c33";
            }, 300);
          }, 2000);
        }

        parseParticipants(text, playerCount) {
          const names = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line.length > 0);

          // 参加者名が入力されていない場合は番号のみで生成
          if (names.length === 0) {
            return Array.from({ length: playerCount }, (_, i) => String(i + 1));
          }

          // 入力された名前を使用し、不足分は番号で補完
          if (names.length < playerCount) {
            const remaining = playerCount - names.length;
            for (let i = 0; i < remaining; i++) {
              names.push(String(names.length + 1));
            }
          }

          // 全ての名前に番号を付ける
          return names.slice(0, playerCount).map((name, index) => {
            // 既に番号のみの場合はそのまま返す
            if (/^\d+$/.test(name)) {
              return name;
            }
            // 名前がある場合は番号を付けて返す
            return `${index + 1}. ${name}`;
          });
        }

        getMatchType() {
          return "doubles";
        }

        async generateRotation() {
          const title = this.titleInput.value.trim();
          const playerCount = parseInt(this.playerCountSelect.value);
          const courtCount = parseInt(this.courtCountSelect.value);
          const roundCount = parseInt(this.roundCountSelect.value);
          const participantsText = this.participantsInput.value;

          if (!playerCount) {
            this.showError("参加人数を選択してください");
            return;
          }

          if (!courtCount) {
            this.showError("コート数を選択してください");
            return;
          }

          // 参加者名を取得（未入力の場合は番号で自動生成）
          const participants = this.parseParticipants(
            participantsText,
            playerCount
          );

          // 参加者名の数チェックはupdateParticipantCountで実施済み

          if (playerCount < 4) {
            this.showError("ダブルスには最低4人必要です");
            return;
          }

          this.showLoading(true);

          await new Promise((resolve) => setTimeout(resolve, 500));

          try {
            const rotation = new RotationGenerator(
              participants,
              courtCount,
              "doubles",
              roundCount
            );
            this.currentCanvas = new RotationCanvas(rotation, title, "doubles");
            this.currentCanvas.draw();

            this.resultSection.classList.add("show");

            setTimeout(() => {
              this.resultSection.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
              });
            }, 100);
          } catch (error) {
            this.showError(
              "ローテーション表の生成中にエラーが発生しました: " + error.message
            );
            console.error(error);
          } finally {
            this.showLoading(false);
          }
        }

        async downloadImage() {
          if (!this.currentCanvas) return;

          try {
            const dataURL = this.currentCanvas.toDataURL();
            const link = document.createElement("a");
            const fileName = `rotation_${Date.now()}.png`;

            link.download = fileName;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } catch (error) {
            this.showError("画像の保存中にエラーが発生しました");
            console.error(error);
          }
        }

        resetForm() {
          this.form.reset();
          this.resultSection.classList.remove("show");
          this.currentCanvas = null;
          this.updatePlayerCountOptions(); // フォームリセット時に参加人数オプションを再設定
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      // アプリケーション初期化
      document.addEventListener("DOMContentLoaded", () => {
        new UIController();
      });
    </script>
  </body>
</html>
