<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>テニス ローテーション表ジェネレーター</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px 20px;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .form-section {
        padding: 30px 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
        font-size: 14px;
      }

      .form-group input[type="text"],
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s;
        font-family: inherit;
        background-color: white;
      }

      .form-group input[type="text"]:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 240px;
        line-height: 1.6;
      }

      .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 8px;
      }

      .radio-group label {
        display: flex;
        align-items: center;
        font-weight: 400;
        cursor: pointer;
      }

      .radio-group input[type="radio"] {
        margin-right: 6px;
        cursor: pointer;
      }

      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-row .form-group {
        flex: 1;
      }

      .form-help {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .result-section {
        display: none;
        padding: 30px 20px;
        background: #f8f9fa;
      }

      .result-section.show {
        display: block;
      }

      .result-title {
        text-align: center;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 600;
        color: #555;
      }

      .canvas-container {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
        overflow-y: auto;
        max-height: 80vh;
        -webkit-overflow-scrolling: touch;
      }

      #rotationCanvas {
        display: block;
        margin: 0 auto;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .btn-secondary {
        background: #6c757d;
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
      }

      .btn-secondary:hover {
        box-shadow: 0 6px 20px rgba(108, 117, 125, 0.6);
      }

      .error-message {
        background: #fee;
        color: #c33;
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      @media (max-width: 768px) {
        .container {
          max-width: 100%;
        }

        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
        }

        .header h1 {
          font-size: 20px;
        }

        .form-section {
          padding: 20px 15px;
        }

        .result-section {
          padding: 20px 15px;
        }
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #667eea;
      }

      .loading.show {
        display: block;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎾 テニス ローテーション表ジェネレーター</h1>
        <p>参加者と設定を入力して、対戦表を自動生成</p>
      </div>

      <div class="form-section">
        <div class="error-message" id="errorMessage"></div>

        <form id="rotationForm">
          <div class="form-group">
            <label for="title">大会名称（任意）</label>
            <input type="text" id="title" placeholder="例: 第1回テニス大会" />
          </div>

          <input type="hidden" name="matchType" value="doubles" />
          <div class="form-group">
            <label>試合形式</label>
            <div class="radio-group">
              <label>
                <input type="radio" name="matchType" value="doubles" checked />
                ダブルス
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="courtCount">コート数</label>
              <select id="courtCount" required>
                <option value="">選択してください</option>
                <option value="1">1面</option>
                <option value="2" selected>2面</option>
                <option value="3">3面</option>
                <option value="4">4面</option>
                <option value="5">5面</option>
              </select>
            </div>

            <div class="form-group">
              <label for="playerCount">参加人数</label>
              <select id="playerCount" required>
                <option value="">選択してください</option>
              </select>
              <div class="form-help" id="playerCountHelp"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="roundCount">ラウンド数</label>
              <select id="roundCount" required>
                <option value="5" selected>5ラウンド</option>
                <option value="10">10ラウンド</option>
                <option value="15">15ラウンド</option>
                <option value="20">20ラウンド</option>
                <option value="25">25ラウンド</option>
                <option value="30">30ラウンド</option>
                <option value="35">35ラウンド</option>
                <option value="40">40ラウンド</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="participants">参加者名（1行に1名、任意）</label>
            <textarea
              id="participants"
              placeholder="田中太郎&#10;鈴木花子&#10;佐藤次郎&#10;山田美咲&#10;&#10;※未入力の場合は番号で表示されます"
              lines="10"
            ></textarea>
            <div
              id="participantCount"
              style="
                margin-top: 5px;
                font-size: 13px;
                color: #667eea;
                font-weight: 600;
              "
            >
              ※ 0名が入力されています
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px">
              <button
                type="button"
                class="btn btn-secondary"
                id="formatBtn"
                style="padding: 8px 15px; font-size: 14px; flex: 1"
              >
                📝 名前を整形する
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                id="randomBtn"
                style="padding: 8px 15px; font-size: 14px; flex: 1"
              >
                🎲 ランダム順にする
              </button>
            </div>
            <div class="form-help" style="margin-top: 10px">
              ※整形ボタン：1行に複数の名前がある場合は分割し、先頭の番号を削除します。<br />
              ※ランダム順ボタン：参加者の順番をランダムに並べ替えます。<br />
              ※名前を入力すると「1.
              田中太郎」のように番号付きで表示されます。未入力の場合は番号（1、2、3...）のみ表示されます。
            </div>
          </div>

          <button type="submit" class="btn" id="generateBtn">
            ローテーション表を生成
          </button>
        </form>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>生成中...</p>
      </div>

      <div class="result-section" id="resultSection">
        <h2 class="result-title">生成された対戦表</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" id="newBtnTop">新規作成</button>
          <button class="btn" id="downloadBtnTop">画像を保存</button>
        </div>
        <div class="canvas-container">
          <canvas id="rotationCanvas"></canvas>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" id="newBtn">新規作成</button>
          <button class="btn" id="downloadBtn">画像を保存</button>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // 定数定義
      // ==========================================
      const SCORING_WEIGHTS = {
        PLAY_COUNT_SORT: 100, // 主役選択時のソート用
        PARTNER_HISTORY: 50, // ペア履歴の重み
        MATCH_HISTORY_PATTERN: 10, // パターン評価時の対戦履歴
        MATCH_HISTORY_SELECT: 5, // 候補選択時の対戦履歴
        PLAY_COUNT_SELECT: 10, // 候補選択時の出場回数
        PLAYER_NUMBER: 0.01, // タイブレーカー
      };

      const MIN_PLAYERS = {
        DOUBLES: 4,
      };

      // ==========================================
      // ユーティリティ関数
      // ==========================================
      class ScoreCalculator {
        /**
         * ペア候補のスコアを計算
         */
        static calculatePairCandidateScore(
          history,
          playCount,
          leadPlayer,
          candidate
        ) {
          const partnerScore =
            -history.partner[leadPlayer][candidate] *
            SCORING_WEIGHTS.PARTNER_HISTORY;
          const matchScore =
            -history.match[leadPlayer][candidate] *
            SCORING_WEIGHTS.MATCH_HISTORY_SELECT;
          const playScore =
            -playCount[candidate] * SCORING_WEIGHTS.PLAY_COUNT_SELECT;
          const playerNumberScore = -candidate * SCORING_WEIGHTS.PLAYER_NUMBER;
          return partnerScore + matchScore + playScore + playerNumberScore;
        }

        /**
         * 対戦主役候補のスコアを計算
         */
        static calculateOpponentLeadScore(history, leadPlayer, candidate) {
          const matchScore = -history.match[leadPlayer][candidate];
          const partnerScore = -history.partner[leadPlayer][candidate];
          return (
            matchScore +
            partnerScore * SCORING_WEIGHTS.PARTNER_HISTORY -
            candidate * SCORING_WEIGHTS.PLAYER_NUMBER
          );
        }

        /**
         * パターン（4人組）のスコアを計算
         */
        static calculatePatternScore(history, t1p1, t1p2, t2p1, t2p2) {
          const partnerScore =
            -(history.partner[t1p1][t1p2] + history.partner[t2p1][t2p2]) *
            SCORING_WEIGHTS.PARTNER_HISTORY;

          const matchScore =
            -(
              history.match[t1p1][t2p1] +
              history.match[t1p1][t2p2] +
              history.match[t1p2][t2p1] +
              history.match[t1p2][t2p2]
            ) * SCORING_WEIGHTS.MATCH_HISTORY_PATTERN;

          return partnerScore + matchScore;
        }
      }

      // ==========================================
      // ローテーション生成クラス
      // ==========================================
      class RotationGenerator {
        constructor(players, courtCount, matchType, roundCount = 10) {
          this.players = players;
          this.courtCount = parseInt(courtCount);
          this.matchType = matchType;
          this.roundCount = parseInt(roundCount);
          this.rounds = [];
          this.initializeStatistics();
          this.generateRotation();
        }

        /**
         * 統計情報の初期化
         */
        initializeStatistics() {
          const playerCount = this.players.length;
          this.playCount = Array(playerCount).fill(0);
          this.matchHistory = Array(playerCount)
            .fill(null)
            .map(() => Array(playerCount).fill(0));
          this.partnerHistory = Array(playerCount)
            .fill(null)
            .map(() => Array(playerCount).fill(0));
        }

        /**
         * ローテーション生成のメインロジック
         */
        generateRotation() {
          const playerCount = this.players.length;
          if (playerCount < MIN_PLAYERS.DOUBLES) {
            throw new Error(`ダブルスには最低${MIN_PLAYERS.DOUBLES}人必要です`);
          }
          this.generateDoublesRotation(playerCount, this.roundCount);
        }

        /**
         * ダブルスローテーション生成
         */
        generateDoublesRotation(playerCount, maxRounds) {
          for (let round = 0; round < maxRounds; round++) {
            const usedInRound = new Set();
            const roundMatches = this.findBestMatchesForRound(
              playerCount,
              usedInRound
            );

            if (roundMatches.length > 0) {
              this.updateStatistics(roundMatches);
              const roundGroup = this.createRoundGroup(roundMatches);
              this.rounds.push(roundGroup);
            }
          }
        }

        /**
         * 統計情報を更新
         */
        updateStatistics(matches) {
          matches.forEach((match) => {
            // 出場回数を更新
            [match.t1p1, match.t1p2, match.t2p1, match.t2p2].forEach(
              (p) => this.playCount[p]++
            );

            // ペア履歴を更新
            this.partnerHistory[match.t1p1][match.t1p2]++;
            this.partnerHistory[match.t1p2][match.t1p1]++;
            this.partnerHistory[match.t2p1][match.t2p2]++;
            this.partnerHistory[match.t2p2][match.t2p1]++;

            // 対戦履歴を更新
            const team1 = [match.t1p1, match.t1p2];
            const team2 = [match.t2p1, match.t2p2];
            team1.forEach((p1) => {
              team2.forEach((p2) => {
                this.matchHistory[p1][p2]++;
                this.matchHistory[p2][p1]++;
              });
            });
          });
        }

        /**
         * ラウンドグループを作成（表示用データ構造）
         */
        createRoundGroup(roundMatches) {
          return roundMatches.map((m) => ({
            team1: [this.players[m.t1p1], this.players[m.t1p2]],
            team2: [this.players[m.t2p1], this.players[m.t2p2]],
            type: "doubles",
            stats: {
              player1: this.createPlayerStats(m.t1p1, m.t1p2, [m.t2p1, m.t2p2]),
              player2: this.createPlayerStats(m.t1p2, m.t1p1, [m.t2p1, m.t2p2]),
              player3: this.createPlayerStats(m.t2p1, m.t2p2, [m.t1p1, m.t1p2]),
              player4: this.createPlayerStats(m.t2p2, m.t2p1, [m.t1p1, m.t1p2]),
            },
          }));
        }

        /**
         * プレイヤー統計データを作成
         */
        createPlayerStats(playerId, partnerId, opponents) {
          return {
            name: this.players[playerId],
            playCount: this.playCount[playerId],
            partnerCount: this.partnerHistory[playerId][partnerId],
            matchCount1: this.matchHistory[playerId][opponents[0]],
            matchCount2: this.matchHistory[playerId][opponents[1]],
          };
        }

        /**
         * 主役プレイヤーを選択
         */
        selectLeadPlayers(availablePlayers, usedInRound) {
          const leadPlayers = [];
          for (let i = 0; i < this.courtCount; i++) {
            leadPlayers.push(availablePlayers[i]);
            usedInRound.add(availablePlayers[i]);
          }
          return leadPlayers;
        }

        /**
         * 対戦主役プレイヤーを選択（パターン評価版）
         */
        selectOpponentLeadPlayers(availablePlayers, leadPlayers, usedInRound) {
          console.log("\n対戦主役プレイヤー選択（汎用最適化版）:");

          // 利用可能な候補者数を確認
          const currentlyAvailable = availablePlayers.filter(
            (p) => !usedInRound.has(p)
          );
          const availableCount = currentlyAvailable.length;
          const requiredCount = this.courtCount * 2; // 各コート2名必要

          console.log(
            `  利用可能プレイヤー: ${availableCount}名, 必要数: ${requiredCount}名`
          );
          console.log(
            `  利用可能な候補: [${currentlyAvailable
              .map((p) => this.players[p])
              .join(", ")}]`
          );
          console.log(`  usedInRoundに登録済み: ${usedInRound.size}名`);

          if (availableCount < requiredCount) {
            console.log(
              `  対戦主役候補が不足（必要:${requiredCount}名, 利用可能:${availableCount}名）`
            );
            return [];
          }

          // 各コートの候補リストを作成
          const opponentCandidatesPerCourt = Array.from(
            { length: this.courtCount },
            () => []
          );

          // 1人目の候補を全コート分選択
          for (let courtIndex = 0; courtIndex < this.courtCount; courtIndex++) {
            console.log(`  --- コート${courtIndex + 1}の1人目候補選択 ---`);
            const candidate = this.selectOpponentCandidate(
              availablePlayers,
              leadPlayers[courtIndex],
              usedInRound
            );
            if (candidate === null) {
              console.log(`コート${courtIndex + 1}の対戦主役候補1が不足`);
              this.releaseOpponentCandidates(
                opponentCandidatesPerCourt,
                courtIndex,
                0,
                usedInRound
              );
              return [];
            }
            console.log(
              `  コート${courtIndex + 1}: ${
                this.players[leadPlayers[courtIndex]]
              }の対戦主役候補1: ${this.players[candidate]}`
            );
            usedInRound.add(candidate);
            opponentCandidatesPerCourt[courtIndex].push(candidate);
          }

          // 2人目の候補を全コート分選択
          for (let courtIndex = 0; courtIndex < this.courtCount; courtIndex++) {
            console.log(`  --- コート${courtIndex + 1}の2人目候補選択 ---`);
            const candidate = this.selectOpponentCandidate(
              availablePlayers,
              leadPlayers[courtIndex],
              usedInRound
            );
            if (candidate === null) {
              console.log(`コート${courtIndex + 1}の対戦主役候補2が不足`);
              this.releaseOpponentCandidates(
                opponentCandidatesPerCourt,
                this.courtCount,
                courtIndex,
                usedInRound
              );
              return [];
            }
            console.log(
              `  コート${courtIndex + 1}: ${
                this.players[leadPlayers[courtIndex]]
              }の対戦主役候補2: ${this.players[candidate]}`
            );
            usedInRound.add(candidate);
            opponentCandidatesPerCourt[courtIndex].push(candidate);
          }

          // パターン評価して最適な組み合わせを選択
          return this.evaluateOpponentPatterns(
            opponentCandidatesPerCourt,
            leadPlayers,
            usedInRound
          );
        }

        /**
         * 対戦主役の候補を1名選択
         */
        selectOpponentCandidate(availablePlayers, leadPlayer, usedInRound) {
          const history = {
            match: this.matchHistory,
            partner: this.partnerHistory,
          };
          let candidates = [];

          // デバッグ情報
          const availableForSelection = availablePlayers.filter(
            (p) => !usedInRound.has(p)
          );
          console.log(
            `    候補選択対象: ${
              availableForSelection.length
            }名 [${availableForSelection
              .map((p) => this.players[p])
              .join(", ")}]`
          );
          console.log(
            `    leadPlayer: ${this.players[leadPlayer]} (ID: ${leadPlayer})`
          );

          for (const candidate of availablePlayers) {
            if (usedInRound.has(candidate)) {
              console.log(
                `      スキップ: ${this.players[candidate]} (usedInRoundに含まれる)`
              );
              continue;
            }

            try {
              const score = ScoreCalculator.calculateOpponentLeadScore(
                history,
                leadPlayer,
                candidate
              );
              console.log(
                `      候補: ${this.players[candidate]}, スコア: ${score}`
              );
              candidates.push({ player: candidate, score });
            } catch (error) {
              console.error(
                `      エラー: ${this.players[candidate]}のスコア計算に失敗`,
                error
              );
            }
          }

          console.log(`    候補リスト長: ${candidates.length}`);
          candidates.sort((a, b) => b.score - a.score);

          if (candidates.length === 0) {
            console.log(
              `    ⚠️ 候補が0名（usedInRoundに${usedInRound.size}名登録済み）`
            );
          } else {
            console.log(`    選択: ${this.players[candidates[0].player]}`);
          }

          return candidates.length > 0 ? candidates[0].player : null;
        }

        /**
         * 対戦主役候補を解放
         */
        releaseOpponentCandidates(
          candidatesPerCourt,
          completedCourts,
          currentCourt,
          usedInRound
        ) {
          for (let j = 0; j < completedCourts; j++) {
            if (candidatesPerCourt[j][0] !== undefined) {
              usedInRound.delete(candidatesPerCourt[j][0]);
            }
            if (j < currentCourt && candidatesPerCourt[j][1] !== undefined) {
              usedInRound.delete(candidatesPerCourt[j][1]);
            }
          }
        }

        /**
         * 対戦主役のパターンを評価
         */
        evaluateOpponentPatterns(
          opponentCandidatesPerCourt,
          leadPlayers,
          usedInRound
        ) {
          console.log("\n主役と対戦主役のパターン評価:");
          const generatePatterns = (index, currentPattern) => {
            if (index === this.courtCount) {
              return [currentPattern.slice()];
            }
            const patterns = [];
            for (let i = 0; i < 2; i++) {
              currentPattern[index] = opponentCandidatesPerCourt[index][i];
              patterns.push(...generatePatterns(index + 1, currentPattern));
            }
            return patterns;
          };

          const allPatterns = generatePatterns(0, []);
          let bestPattern = null;
          let bestScore = -Infinity;

          for (const pattern of allPatterns) {
            let matchScore = 0;
            let partnerScore = 0;

            for (let i = 0; i < this.courtCount; i++) {
              matchScore -= this.matchHistory[leadPlayers[i]][pattern[i]];
              partnerScore -= this.partnerHistory[leadPlayers[i]][pattern[i]];
            }

            const score =
              matchScore + partnerScore * SCORING_WEIGHTS.PARTNER_HISTORY;
            const patternStr = pattern
              .map(
                (opp, idx) =>
                  `コート${idx + 1}: ${this.players[leadPlayers[idx]]} vs ${
                    this.players[opp]
                  }`
              )
              .join(", ");
            console.log(`  ${patternStr}: スコア=${score}`);

            if (score > bestScore) {
              bestScore = score;
              bestPattern = pattern;
            }
          }

          if (bestPattern) {
            const selectionStr = bestPattern
              .map(
                (opp, idx) =>
                  `コート${idx + 1}: ${this.players[leadPlayers[idx]]} vs ${
                    this.players[opp]
                  }`
              )
              .join(", ");
            console.log(`最終選択: ${selectionStr}`);

            // 使用されなかった候補を解放
            const allCandidates = opponentCandidatesPerCourt.flat();
            allCandidates.forEach((opp) => {
              if (!bestPattern.includes(opp)) {
                usedInRound.delete(opp);
              }
            });
          }

          return bestPattern || [];
        }

        findBestDoublesMatch(playerCount, usedInRound) {
          let bestMatch = null;
          let bestScore = -Infinity;

          // 出場回数が少ないプレイヤーから順に
          const availablePlayers = Array.from(
            { length: playerCount },
            (_, i) => i
          )
            .filter((i) => !usedInRound.has(i))
            .sort((a, b) => this.playCount[a] - this.playCount[b]);

          if (availablePlayers.length < 4) return null;

          // 4人のプレイヤーの全組み合わせを試す
          for (let i = 0; i < availablePlayers.length - 3; i++) {
            for (let j = i + 1; j < availablePlayers.length - 2; j++) {
              for (let k = j + 1; k < availablePlayers.length - 1; k++) {
                for (let l = k + 1; l < availablePlayers.length; l++) {
                  const p1 = availablePlayers[i];
                  const p2 = availablePlayers[j];
                  const p3 = availablePlayers[k];
                  const p4 = availablePlayers[l];

                  // 4人が決まったら、3通りのペア組み合わせパターンを評価
                  const patterns = [
                    { t1p1: p1, t1p2: p2, t2p1: p3, t2p2: p4 }, // (1,2) vs (3,4)
                    { t1p1: p1, t1p2: p3, t2p1: p2, t2p2: p4 }, // (1,3) vs (2,4)
                    { t1p1: p1, t1p2: p4, t2p1: p2, t2p2: p3 }, // (1,4) vs (2,3)
                  ];

                  // 各パターンのスコアを計算し、最適なパターンを選択
                  for (const pattern of patterns) {
                    const { t1p1, t1p2, t2p1, t2p2 } = pattern;
                    const history = {
                      match: this.matchHistory,
                      partner: this.partnerHistory,
                    };
                    const score = ScoreCalculator.calculatePatternScore(
                      history,
                      t1p1,
                      t1p2,
                      t2p1,
                      t2p2
                    );

                    if (score > bestScore) {
                      bestScore = score;
                      bestMatch = { t1p1, t1p2, t2p1, t2p2 };
                    }
                  }
                }
              }
            }
          }

          return bestMatch;
        }

        // 汎用ロジック：ラウンド全体の最適なマッチを生成
        findBestMatchesForRound(playerCount, usedInRound) {
          console.log("\n=== ラウンド生成開始 ===");
          const matches = [];

          // 利用可能なプレイヤーを出場回数の少ない順にソート
          const availablePlayers = Array.from(
            { length: playerCount },
            (_, i) => i
          )
            .filter((i) => !usedInRound.has(i))
            .sort((a, b) => this.playCount[a] - this.playCount[b]);

          console.log(
            `利用可能プレイヤー（${availablePlayers.length}名）:`,
            availablePlayers
              .map((p) => `${this.players[p]}(出場:${this.playCount[p]})`)
              .join(", ")
          );

          const requiredPlayers = this.courtCount * 4;
          if (availablePlayers.length < requiredPlayers) {
            console.log(
              `プレイヤー不足で終了（必要:${requiredPlayers}名, 利用可能:${availablePlayers.length}名）`
            );
            return matches;
          }

          // ステップ1: 各コートの主役プレイヤーを選択（出場回数が少ない順）
          const leadPlayers = this.selectLeadPlayers(
            availablePlayers,
            usedInRound
          );
          console.log(
            "主役プレイヤー:",
            leadPlayers.map((p) => this.players[p]).join(", ")
          );

          // ステップ2: 対戦主役プレイヤーを交互に選択（汎用版）
          const opponentLeadPlayers = this.selectOpponentLeadPlayers(
            availablePlayers,
            leadPlayers,
            usedInRound
          );
          if (opponentLeadPlayers.length < this.courtCount) {
            console.log("対戦主役プレイヤーの選択に失敗");
            return matches;
          }

          // ステップ3: 各コートのマッチを作成
          console.log("\nマッチ作成:");
          for (let court = 0; court < this.courtCount; court++) {
            console.log(`\n--- コート${court + 1} ---`);
            if (
              court >= leadPlayers.length ||
              court >= opponentLeadPlayers.length
            ) {
              console.log("主役プレイヤー不足");
              break;
            }

            const lead1 = leadPlayers[court];
            const lead2 = opponentLeadPlayers[court];
            console.log(
              `主役: ${this.players[lead1]} vs ${this.players[lead2]}`
            );

            // 利用可能なプレイヤー数を確認
            const remainingPlayers = availablePlayers.filter(
              (p) => !usedInRound.has(p)
            );
            console.log(`  残りプレイヤー: ${remainingPlayers.length}名`);

            // 最低2名必要（各主役に1名ずつ）
            if (remainingPlayers.length < 2) {
              console.log("ペアプレイヤーが不足（最低2名必要）");
              continue;
            }

            // 各主役に最大2名、最低1名のペア候補を選択
            const pairsNeeded = Math.min(
              2,
              Math.floor(remainingPlayers.length / 2)
            );
            console.log(`  各主役に${pairsNeeded}名のペア候補を選択`);

            // lead1のペア候補を選択
            // lead1のペア候補を選択
            const lead1Partners = [];
            let lead1Candidates = [];
            for (const candidate of availablePlayers) {
              if (usedInRound.has(candidate)) continue;

              const partnerScore = -this.partnerHistory[lead1][candidate] * 50;
              const matchScore = -this.matchHistory[lead1][candidate] * 5;
              const playScore = -this.playCount[candidate] * 10;
              const playerNumberScore = -candidate * 0.01;
              const score =
                partnerScore + matchScore + playScore + playerNumberScore;

              lead1Candidates.push({ player: candidate, score });
            }
            lead1Candidates.sort((a, b) => b.score - a.score);

            if (lead1Candidates.length < pairsNeeded) {
              console.log(
                `lead1のペア候補が不足（必要:${pairsNeeded}名, 利用可能:${lead1Candidates.length}名）`
              );
              continue;
            }

            for (let i = 0; i < pairsNeeded; i++) {
              const partner = lead1Candidates[i].player;
              lead1Partners.push(partner);
              usedInRound.add(partner);
            }
            console.log(
              `${this.players[lead1]}のペア候補: ${lead1Partners
                .map((p) => this.players[p])
                .join(", ")}`
            );

            // lead2のペア候補を選択
            const lead2Partners = [];
            let lead2Candidates = [];
            for (const candidate of availablePlayers) {
              if (usedInRound.has(candidate)) continue;

              const partnerScore = -this.partnerHistory[lead2][candidate] * 50;
              const matchScore = -this.matchHistory[lead2][candidate] * 5;
              const playScore = -this.playCount[candidate] * 10;
              const playerNumberScore = -candidate * 0.01;
              const score =
                partnerScore + matchScore + playScore + playerNumberScore;

              lead2Candidates.push({ player: candidate, score });
            }
            lead2Candidates.sort((a, b) => b.score - a.score);

            if (lead2Candidates.length < pairsNeeded) {
              console.log(
                `lead2のペア候補が不足（必要:${pairsNeeded}名, 利用可能:${lead2Candidates.length}名）`
              );
              lead1Partners.forEach((p) => usedInRound.delete(p));
              continue;
            }

            for (let i = 0; i < pairsNeeded; i++) {
              const partner = lead2Candidates[i].player;
              lead2Partners.push(partner);
              usedInRound.add(partner);
            }
            console.log(
              `${this.players[lead2]}のペア候補: ${lead2Partners
                .map((p) => this.players[p])
                .join(", ")}`
            );

            // パターンを評価してマッチを作成
            let bestMatch = null;

            if (pairsNeeded === 1) {
              // 1名ずつの場合は1パターンのみ
              bestMatch = {
                t1p1: lead1,
                t1p2: lead1Partners[0],
                t2p1: lead2,
                t2p2: lead2Partners[0],
              };
              console.log(
                `マッチ: (${this.players[lead1]},${
                  this.players[lead1Partners[0]]
                }) vs ` +
                  `(${this.players[lead2]},${this.players[lead2Partners[0]]})`
              );
            } else {
              // 2名ずつの場合は4パターンを評価
              const patterns = [
                {
                  t1p1: lead1,
                  t1p2: lead1Partners[0],
                  t2p1: lead2,
                  t2p2: lead2Partners[0],
                },
                {
                  t1p1: lead1,
                  t1p2: lead1Partners[0],
                  t2p1: lead2,
                  t2p2: lead2Partners[1],
                },
                {
                  t1p1: lead1,
                  t1p2: lead1Partners[1],
                  t2p1: lead2,
                  t2p2: lead2Partners[0],
                },
                {
                  t1p1: lead1,
                  t1p2: lead1Partners[1],
                  t2p1: lead2,
                  t2p2: lead2Partners[1],
                },
              ];

              let bestMatchScore = -Infinity;
              console.log("\nペアパターン評価 (4パターン):");

              for (const pattern of patterns) {
                const { t1p1, t1p2, t2p1, t2p2 } = pattern;

                const partnerScore =
                  -(
                    this.partnerHistory[t1p1][t1p2] +
                    this.partnerHistory[t2p1][t2p2]
                  ) * 50;
                const matchScore =
                  -(
                    this.matchHistory[t1p1][t2p1] +
                    this.matchHistory[t1p1][t2p2] +
                    this.matchHistory[t1p2][t2p1] +
                    this.matchHistory[t1p2][t2p2]
                  ) * 10;

                const score = partnerScore + matchScore;
                console.log(
                  `  (${this.players[t1p1]},${this.players[t1p2]}) vs (${this.players[t2p1]},${this.players[t2p2]}): スコア=${score}`
                );

                if (score > bestMatchScore) {
                  bestMatchScore = score;
                  bestMatch = pattern;
                }
              }

              console.log(
                `最終選択: (${this.players[bestMatch.t1p1]},${
                  this.players[bestMatch.t1p2]
                }) vs (${this.players[bestMatch.t2p1]},${
                  this.players[bestMatch.t2p2]
                })`
              );

              // 使用されなかった候補をusedInRoundから削除
              const usedPartners = [bestMatch.t1p2, bestMatch.t2p2];
              const allPartners = [...lead1Partners, ...lead2Partners];
              for (const partner of allPartners) {
                if (!usedPartners.includes(partner)) {
                  usedInRound.delete(partner);
                }
              }
            }

            matches.push(bestMatch);
          }

          console.log("\n=== ラウンド生成完了 ===\n");
          return matches;
        }

        /**
         * ペア候補を選択（指定数）
         */
        selectPairCandidates(leadPlayer, availablePlayers, usedInRound, count) {
          const history = {
            match: this.matchHistory,
            partner: this.partnerHistory,
          };
          const candidates = [];

          for (const candidate of availablePlayers) {
            if (usedInRound.has(candidate)) continue;
            const score = ScoreCalculator.calculatePairCandidateScore(
              history,
              this.playCount,
              leadPlayer,
              candidate
            );
            candidates.push({ player: candidate, score });
          }

          candidates.sort((a, b) => b.score - a.score);
          return candidates.slice(0, count).map((c) => c.player);
        }

        /**
         * ペアパターンを評価（4パターン）
         */
        evaluatePairPatterns(lead1, lead2, lead1Partners, lead2Partners) {
          const patterns = [
            {
              t1p1: lead1,
              t1p2: lead1Partners[0],
              t2p1: lead2,
              t2p2: lead2Partners[0],
            },
            {
              t1p1: lead1,
              t1p2: lead1Partners[0],
              t2p1: lead2,
              t2p2: lead2Partners[1],
            },
            {
              t1p1: lead1,
              t1p2: lead1Partners[1],
              t2p1: lead2,
              t2p2: lead2Partners[0],
            },
            {
              t1p1: lead1,
              t1p2: lead1Partners[1],
              t2p1: lead2,
              t2p2: lead2Partners[1],
            },
          ];

          let bestMatch = null;
          let bestScore = -Infinity;

          const history = {
            match: this.matchHistory,
            partner: this.partnerHistory,
          };
          for (const pattern of patterns) {
            const { t1p1, t1p2, t2p1, t2p2 } = pattern;
            const score = ScoreCalculator.calculatePatternScore(
              history,
              t1p1,
              t1p2,
              t2p1,
              t2p2
            );

            if (score > bestScore) {
              bestScore = score;
              bestMatch = pattern;
            }
          }

          return bestMatch;
        }

        getRounds() {
          return this.rounds;
        }
      }

              shuffledColors[j],
              shuffledColors[i],
            ];
          }

          const courtCount = this.rotation.courtCount;
          this.courtColors = Array(courtCount)
            .fill(null)
            .map((_, index) => shuffledColors[index % shuffledColors.length]);

        setupCanvas() {
          const rounds = this.rotation.getRounds();

          // 縦長レイアウト：幅は固定、高さは動的に計算
          this.canvasWidth = this.courtWidth + this.padding * 2;

          // 高さの計算：各ラウンドのコート数に応じて
          let totalHeight =
            this.padding + this.config.layout.titleTopMargin + this.titleHeight;

          // アイコン凡例の高さを追加
          totalHeight += 15 + 50 + 20; // 上余白 + 凡例高さ + 下余白

          rounds.forEach((round) => {
            totalHeight += 55; // ラウンドヘッダー（実際のdrawRotationと一致させる）
            totalHeight +=
              round.length * (this.courtLabelHeight + this.courtHeight); // 各コートの高さ（コート名 + 本体）
            totalHeight += (round.length - 1) * this.courtGap; // コート間の余白
            totalHeight += this.roundGap; // ラウンド後の余白
          });

          totalHeight += this.padding; // 最後のパディング

          this.canvasHeight = totalHeight;

          // 高DPI対応
          const dpr = window.devicePixelRatio || 1;
          this.canvas.width = this.canvasWidth * dpr;
          this.canvas.height = this.canvasHeight * dpr;
          this.canvas.style.width = this.canvasWidth + "px";
          this.canvas.style.height = this.canvasHeight + "px";

          this.ctx.scale(dpr, dpr);
        }

        draw() {
          // 背景
          this.ctx.fillStyle = "#ffffff";
          this.ctx.fillRect(0, 0, this.canvasWidth, this.canvasHeight);

          // タイトル描画
          this.drawTitle();

          // ローテーション描画
          this.drawRotation();
        }

        drawTitle() {
          // タイトルの長さに応じて改行して行数を計算
          const titleText = this.title || "ローテーション表";
          const maxWidth = this.canvasWidth - this.padding * 4;

          // 一時的にフォントを設定してテキスト測定
          this.ctx.font = "bold 24px sans-serif";
          const lines = this.wrapText(
            titleText,
            maxWidth,
            "bold 24px sans-serif"
          );

          const lineHeight = 28;
          const additionalHeight = Math.max(0, (lines.length - 1) * lineHeight);
          this.titleHeight = this.baseTitleHeight + additionalHeight;

          const titleTopMargin = this.config.layout.titleTopMargin;

          // タイトル背景（可愛いパステルグラデーション）
          const gradient = this.ctx.createLinearGradient(
            0,
            this.padding + titleTopMargin,
            0,
            titleTopMargin + this.titleHeight
          );
          gradient.addColorStop(0, "#7B9FE3");
          gradient.addColorStop(1, "#5A7ACD");

          this.ctx.fillStyle = gradient;
          // 角丸の背景
          this.roundRect(
            this.padding,
            this.padding + titleTopMargin,
            this.canvasWidth - this.padding * 2,
            this.titleHeight - this.padding,
            15
          );
          this.ctx.fill();

          // タイトルテキスト
          this.ctx.fillStyle = "#ffffff";
          this.ctx.font = "bold 24px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          // テキストに影をつける
          this.ctx.shadowColor = "rgba(0, 0, 0, 0.2)";
          this.ctx.shadowBlur = 3;
          this.ctx.shadowOffsetX = 1;
          this.ctx.shadowOffsetY = 1;

          const startY = this.padding + titleTopMargin + 25;

          lines.forEach((line, index) => {
            this.ctx.fillText(
              line,
              this.canvasWidth / 2,
              startY + index * lineHeight
            );
          });

          // サブタイトル
          this.ctx.font = "14px sans-serif";
          this.ctx.fillText(
            `ダブルス 対戦表 ✨`,
            this.canvasWidth / 2,
            this.padding + titleTopMargin + 55 + additionalHeight
          );
          this.ctx.shadowColor = "transparent";
        }

        drawRotation() {
          const rounds = this.rotation.getRounds();
          let currentY =
            this.padding + this.config.layout.titleTopMargin + this.titleHeight;

          rounds.forEach((round, roundIndex) => {
            // 第1ラウンドの前にアイコン凡例を表示
            if (roundIndex === 0) {
              currentY += 15; // 余白
              const legendHeight = this.drawLegend(currentY);
              currentY += legendHeight + 20; // 凡例の高さ + 余白
            }

            // ラウンドヘッダー
            this.drawRoundHeader(currentY, roundIndex + 1);
            currentY += 55; // ヘッダーの高さ分進める（コート名と被らないように余白を確保）

            // 各コートの試合を縦に並べる
            round.forEach((match, courtIndex) => {
              const courtX = this.padding; // 常に左端から
              this.drawMatch(courtX, currentY, match, courtIndex, roundIndex);
              currentY +=
                this.courtLabelHeight + this.courtHeight + this.courtGap; // コート名 + 本体 + 次のコートの位置へ
            });

            // 最後のコートの余白を調整し、ラウンド間の余白を追加
            currentY = currentY - this.courtGap + this.roundGap;
          });
        }

        drawLegend(y) {
          // アイコンの説明を表示
          const legendHeight = 50;
          const legendY = y;

          // 背景
          this.ctx.fillStyle = "#F8F9FA";
          this.roundRect(
            this.padding,
            legendY,
            this.canvasWidth - this.padding * 2,
            legendHeight,
            10
          );
          this.ctx.fill();

          // 枠線
          this.ctx.strokeStyle = "#E0E0E0";
          this.ctx.lineWidth = 1;
          this.roundRect(
            this.padding,
            legendY,
            this.canvasWidth - this.padding * 2,
            legendHeight,
            10
          );
          this.ctx.stroke();

          // タイトル
          this.ctx.fillStyle = "#555";
          this.ctx.font = "bold 14px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "top";
          this.ctx.fillText(
            "アイコンの説明",
            this.canvasWidth / 2,
            legendY + 8
          );

          // アイコン説明（横並び）
          this.ctx.font = "15px sans-serif";
          this.ctx.fillStyle = "#666";
          const iconY = legendY + 28;
          const spacing = (this.canvasWidth - this.padding * 2) / 3;

          // 🎾 出場
          this.ctx.textAlign = "center";
          this.ctx.fillText("🎾 出場回数", this.padding + spacing / 2, iconY);

          // 👫 ペア（ダブルスのみ）
          if (this.matchType === "doubles") {
            this.ctx.fillText(
              "👫 ペア回数",
              this.padding + spacing * 1.5,
              iconY
            );
          }

          // ⚔️ 対戦
          this.ctx.fillText("⚔️ 対戦回数", this.padding + spacing * 2.5, iconY);

          return legendHeight;
        }

        drawRoundHeader(y, roundNumber) {
          // 可愛い背景バッジ
          const badgeWidth = 180;
          const badgeHeight = 30;
          const badgeX = (this.canvasWidth - badgeWidth) / 2;

          this.ctx.fillStyle = "#FFE5F1";
          this.roundRect(badgeX, y, badgeWidth, badgeHeight, 15);
          this.ctx.fill();

          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 2;
          this.roundRect(badgeX, y, badgeWidth, badgeHeight, 15);
          this.ctx.stroke();

          this.ctx.fillStyle = "#FF69B4";
          this.ctx.font = "bold 16px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          this.ctx.fillText(
            `★ 第${roundNumber}ラウンド ★`,
            this.canvasWidth / 2,
            y + badgeHeight / 2
          );
        }

        drawMatch(x, y, match, courtIndex, roundIndex) {
          // ボックスの柔らかい影（強調）
          this.ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
          this.ctx.shadowBlur = 8;
          this.ctx.shadowOffsetX = 2;
          this.ctx.shadowOffsetY = 4;

          // ボックス背景（コート毎に同じ色）
          this.ctx.fillStyle = this.courtColors[courtIndex];
          this.roundRect(x, y, this.courtWidth, this.courtHeight, 12);
          this.ctx.fill();

          // ボックス枠線（可愛いカラー）
          this.ctx.shadowColor = "transparent";
          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 3;
          this.roundRect(x, y, this.courtWidth, this.courtHeight, 12);
          this.ctx.stroke();

          this.drawDoublesMatch(x, y, match, courtIndex);
        }

        drawDoublesMatch(x, y, match, courtIndex) {
          // 4枠レイアウト（1×4グリッド）
          const cellWidth = this.courtWidth / 4;
          const cellHeight = this.courtHeight;

          // 縦の仕切り線
          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([5, 5]);

          // 左から1本目の縦線（点線）
          this.ctx.beginPath();
          this.ctx.moveTo(x + cellWidth, y);
          this.ctx.lineTo(x + cellWidth, y + this.courtHeight);
          this.ctx.stroke();

          // 左から2本目の縦線（実線）
          this.ctx.setLineDash([]);
          this.ctx.beginPath();
          this.ctx.moveTo(x + cellWidth * 2, y);
          this.ctx.lineTo(x + cellWidth * 2, y + this.courtHeight);
          this.ctx.stroke();
          this.ctx.setLineDash([5, 5]);

          // 左から3本目の縦線（点線）
          this.ctx.beginPath();
          this.ctx.moveTo(x + cellWidth * 3, y);
          this.ctx.lineTo(x + cellWidth * 3, y + this.courtHeight);
          this.ctx.stroke();

          this.ctx.setLineDash([]);

          // コート名（4枠の外側・上部）
          const courtLabel = String.fromCharCode(65 + courtIndex);
          this.ctx.fillStyle = "#FF69B4";
          this.ctx.font = "bold 12px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "bottom";
          this.ctx.fillText(
            `コート${courtLabel}`,
            x + this.courtWidth / 2,
            y - 5
          );

          // VS マーク（中央、可愛いスタイル）- 先に描画
          const vsX = x + this.courtWidth / 2;
          const vsY = y + this.courtHeight / 2;

          // 背景の円
          this.ctx.fillStyle = "#FFE5F1";
          this.ctx.beginPath();
          this.ctx.arc(vsX, vsY, 18, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.strokeStyle = "#FFB6D9";
          this.ctx.lineWidth = 2;
          this.ctx.beginPath();
          this.ctx.arc(vsX, vsY, 18, 0, Math.PI * 2);
          this.ctx.stroke();

          this.ctx.fillStyle = "#FF69B4";
          this.ctx.font = "bold 14px sans-serif";
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          this.ctx.fillText("VS", vsX, vsY);

          // プレイヤー1（左端） - 枚内左側に統計
          this.drawPlayerStats(
            x + cellWidth / 2,
            y + 5,
            match.stats.player1.name,
            match.stats.player1.playCount,
            match.stats.player1.partnerCount,
            [match.stats.player1.matchCount1, match.stats.player1.matchCount2],
            cellWidth - 10,
            "left",
            x // 枚の左端位置
          );

          // プレイヤー2（左から2番目） - 枚内左側に統計
          this.drawPlayerStats(
            x + cellWidth + cellWidth / 2,
            y + 5,
            match.stats.player2.name,
            match.stats.player2.playCount,
            match.stats.player2.partnerCount,
            [match.stats.player2.matchCount1, match.stats.player2.matchCount2],
            cellWidth - 10,
            "left",
            x + cellWidth // 枚の左端位置
          );

          // プレイヤー3（左から3番目） - 枚内右側に統計
          this.drawPlayerStats(
            x + cellWidth * 2 + cellWidth / 2,
            y + 5,
            match.stats.player3.name,
            match.stats.player3.playCount,
            match.stats.player3.partnerCount,
            [match.stats.player3.matchCount1, match.stats.player3.matchCount2],
            cellWidth - 10,
            "right",
            x + cellWidth * 3 // 枚の右端位置
          );

          // プレイヤー4（右端） - 枚内右側に統計
          this.drawPlayerStats(
            x + cellWidth * 3 + cellWidth / 2,
            y + 5,
            match.stats.player4.name,
            match.stats.player4.playCount,
            match.stats.player4.partnerCount,
            [match.stats.player4.matchCount1, match.stats.player4.matchCount2],
            cellWidth - 10,
            "right",
            x + cellWidth * 4 // 枚の右端位置
          );
        }

        drawPlayerStats(
          x,
          y,
          name,
          playCount,
          partnerCount,
          matchCount,
          maxWidth,
          statsAlign = null,
          cellEdgeX = null
        ) {
          // プレイヤー番号と名前を分離
          const nameMatch = name.match(/^(\d+)\.\s*(.+)$/);
          let playerNumber = null;
          let playerName = name;

          if (nameMatch) {
            playerNumber = nameMatch[1];
            playerName = nameMatch[2];
          } else if (/^\d+$/.test(name)) {
            // 番号のみの場合
            playerNumber = name;
            playerName = "";
          }

          // 3行レイアウト：バッジ → プレイヤー名 → 統計情報
          let currentY = y;

          // 1行目：プレイヤー番号バッジ
          if (playerNumber) {
            const badgeSize = 24;
            const badgeX = x;
            let badgeY;

            // プレイヤー名がない場合は縦横中央に配置
            if (!playerName) {
              badgeY = y + this.courtHeight / 2 - 8;
            } else {
              badgeY = currentY + badgeSize / 2 + 2;
            }

            // バッジに影を追加
            this.ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
            this.ctx.shadowBlur = 4;
            this.ctx.shadowOffsetX = 2;
            this.ctx.shadowOffsetY = 2;

            // バッジ背景（プレイヤー番号に基づいた色）
            this.ctx.fillStyle = this.getBadgeColor(playerNumber);
            this.ctx.beginPath();
            this.ctx.arc(badgeX, badgeY, badgeSize / 2, 0, Math.PI * 2);
            this.ctx.fill();

            // 影をリセット
            this.ctx.shadowColor = "transparent";
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetX = 0;
            this.ctx.shadowOffsetY = 0;

            // バッジ枠線
            this.ctx.strokeStyle = "#FFFFFF";
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(badgeX, badgeY, badgeSize / 2, 0, Math.PI * 2);
            this.ctx.stroke();

            // 番号テキスト（影付き）
            this.ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
            this.ctx.shadowBlur = 2;
            this.ctx.shadowOffsetX = 1;
            this.ctx.shadowOffsetY = 1;

            this.ctx.fillStyle = "#FFFFFF";
            this.ctx.font = "bold 12px sans-serif";
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "middle";
            this.ctx.fillText(playerNumber, badgeX, badgeY);

            // 影をリセット
            this.ctx.shadowColor = "transparent";
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetX = 0;
            this.ctx.shadowOffsetY = 0;

            // プレイヤー名がある場合のみcurrentYを更新
            if (playerName) {
              currentY += badgeSize + 8;
            }
          }

          // 2行目：プレイヤー名（あれば、中央揃え）
          if (playerName) {
            // 影を追加（深く）
            this.ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            this.ctx.shadowBlur = 2;
            this.ctx.shadowOffsetX = 1;
            this.ctx.shadowOffsetY = 1;

            // プレイヤー番号バッジの背景色と同じ色を使用
            this.ctx.fillStyle = this.getBadgeColor(playerNumber);
            this.ctx.font = "bold 20px sans-serif";
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "top";
            this.ctx.fillText(
              this.truncateText(playerName, maxWidth),
              x,
              currentY
            );

            // 影をリセット
            this.ctx.shadowColor = "transparent";
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetX = 0;
            this.ctx.shadowOffsetY = 0;

            currentY += 24;
          }

          // 3行目：統計情報
          // statsAlignが指定されている場合は枚内の左/右に横並びで表示
          if (playCount !== null && playCount !== undefined) {
            if (statsAlign && cellEdgeX !== null) {
              // 横並び表示（ダブルス用） - 左下または右下に配置
              this.ctx.font = "12px sans-serif";
              this.ctx.fillStyle = "#8B4789";
              this.ctx.textBaseline = "bottom";
              this.ctx.textAlign = statsAlign;

              const statsX =
                statsAlign === "left" ? cellEdgeX + 5 : cellEdgeX - 5;
              const bottomMargin = 10; // 下からの余白
              const statsY = y + this.courtHeight - bottomMargin;

              // 統計情報を横並びで表示
              const stats = [];
              stats.push(`🎾${playCount}`);
              stats.push(`👫${partnerCount}`);
              stats.push(`⚔️${matchCount[0]},${matchCount[1]}`);
              const statsText = stats.join(" ");

              this.ctx.fillText(statsText, statsX, statsY);
            } else {
              // 横並び表示（シングルス用）
              this.ctx.fillStyle = "#8B4789";
              this.ctx.font = "12px sans-serif";
              this.ctx.textAlign = "center";
              this.ctx.textBaseline = "top";

              const stats = [];

              // 出場
              stats.push(`🎾${playCount}`);

              // ペア（ダブルスの場合のみ）
              if (partnerCount !== null && partnerCount !== undefined) {
                stats.push(`👫${partnerCount}`);
              }

              // 対戦
              if (Array.isArray(matchCount)) {
                stats.push(`⚔️${matchCount[0]},${matchCount[1]}`);
              } else {
                stats.push(`⚔️${matchCount}`);
              }

              // 横並びで表示
              const statsText = stats.join(" ");
              this.ctx.fillText(statsText, x, currentY);
            }
          }
        }

        // プレイヤー番号に基づいてバッジ色を取得
        getBadgeColor(playerNumber) {
          const num = parseInt(playerNumber);
          if (isNaN(num)) return this.badgeColors[0];
          return this.badgeColors[(num - 1) % this.badgeColors.length];
        }

        // 角丸矩形を描画するヘルパーメソッド
        roundRect(x, y, width, height, radius) {
          this.ctx.beginPath();
          this.ctx.moveTo(x + radius, y);
          this.ctx.lineTo(x + width - radius, y);
          this.ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
          this.ctx.lineTo(x + width, y + height - radius);
          this.ctx.quadraticCurveTo(
            x + width,
            y + height,
            x + width - radius,
            y + height
          );
          this.ctx.lineTo(x + radius, y + height);
          this.ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
          this.ctx.lineTo(x, y + radius);
          this.ctx.quadraticCurveTo(x, y, x + radius, y);
          this.ctx.closePath();
        }

        // テキストを指定幅で改行するヘルパーメソッド
        wrapText(text, maxWidth, font) {
          this.ctx.font = font;
          const words = text.split("");
          const lines = [];
          let currentLine = "";

          for (let i = 0; i < words.length; i++) {
            const testLine = currentLine + words[i];
            const metrics = this.ctx.measureText(testLine);

            if (metrics.width > maxWidth && currentLine.length > 0) {
              lines.push(currentLine);
              currentLine = words[i];
            } else {
              currentLine = testLine;
            }
          }

          if (currentLine.length > 0) {
            lines.push(currentLine);
          }

          return lines;
        }

        truncateText(text, maxWidth) {
          const metrics = this.ctx.measureText(text);
          if (metrics.width <= maxWidth) {
            return text;
          }

          let truncated = text;
          while (
            this.ctx.measureText(truncated + "...").width > maxWidth &&
            truncated.length > 0
          ) {
            truncated = truncated.slice(0, -1);
          }
          return truncated + "...";
        }

        toDataURL() {
          return this.canvas.toDataURL("image/png", 1.0);
        }
      }

      // UIコントローラー
      class UIController {
        constructor() {
          this.form = document.getElementById("rotationForm");
          this.titleInput = document.getElementById("title");
          this.playerCountSelect = document.getElementById("playerCount");
          this.courtCountSelect = document.getElementById("courtCount");
          this.roundCountSelect = document.getElementById("roundCount");
          this.participantsInput = document.getElementById("participants");
          this.participantCount = document.getElementById("participantCount");
          this.generateBtn = document.getElementById("generateBtn");
          this.formatBtn = document.getElementById("formatBtn");
          this.randomBtn = document.getElementById("randomBtn");
          this.newBtn = document.getElementById("newBtn");
          this.newBtnTop = document.getElementById("newBtnTop");
          this.downloadBtn = document.getElementById("downloadBtn");
          this.downloadBtnTop = document.getElementById("downloadBtnTop");
          this.resultSection = document.getElementById("resultSection");
          this.errorMessage = document.getElementById("errorMessage");
          this.loading = document.getElementById("loading");

          this.currentCanvas = null;

          this.bindEvents();
          this.updatePlayerCountOptions(); // 初期化時に参加人数オプションを設定

          // デフォルトタイトルを設定（年始からの日数を計算）
          this.setDefaultTitle();

          // デフォルト値を設定（ダブルス、6人、1コート）
          setTimeout(() => {
            if (this.playerCountSelect.querySelector('option[value="10"]')) {
              this.playerCountSelect.value = "10";
            }
          }, 0);
        }

        setDefaultTitle() {
          const today = new Date();
          const startOfYear = new Date(today.getFullYear(), 0, 1);
          const dayOfYear =
            Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
          this.titleInput.value = `第${dayOfYear}回 フレームショット選手権`;
        }

        bindEvents() {
          this.form.addEventListener("submit", (e) => {
            e.preventDefault();
            this.generateRotation();
          });

          this.formatBtn.addEventListener("click", () => {
            this.formatParticipants();
          });

          this.randomBtn.addEventListener("click", () => {
            this.randomizeParticipants();
          });

          this.newBtn.addEventListener("click", () => {
            this.resetForm();
          });

          this.newBtnTop.addEventListener("click", () => {
            this.resetForm();
          });

          this.downloadBtn.addEventListener("click", () => {
            this.downloadImage();
          });

          this.downloadBtnTop.addEventListener("click", () => {
            this.downloadImage();
          });

          // コート数が変更されたら参加人数の選択肢を更新
          this.courtCountSelect.addEventListener("change", () => {
            this.updatePlayerCountOptions();
          });

          // 参加者名入力時に人数を表示
          this.participantsInput.addEventListener("input", () => {
            this.updateParticipantCount();
          });

          // 参加人数選択時にも警告チェック
          this.playerCountSelect.addEventListener("change", () => {
            this.updateParticipantCount();
          });
        }

        updateParticipantCount() {
          const text = this.participantsInput.value;
          const names = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line.length > 0);

          const count = names.length;
          const selectedCount = parseInt(this.playerCountSelect.value) || 0;

          if (count === 0) {
            this.participantCount.textContent = "※ 0名が入力されています";
            this.participantCount.style.color = "#999";
            this.participantCount.style.backgroundColor = "transparent";
            this.participantCount.style.fontWeight = "normal";
          } else if (selectedCount > 0 && count !== selectedCount) {
            // 警告表示
            if (count > selectedCount) {
              this.participantCount.textContent = `⚠️ ${count}名が入力されています（参加人数: ${selectedCount}名）最初の${selectedCount}名のみ使用されます`;
            } else {
              this.participantCount.textContent = `⚠️ ${count}名が入力されています（参加人数: ${selectedCount}名）不足分は番号で補完されます`;
            }
            this.participantCount.style.color = "#ff6b6b";
            this.participantCount.style.backgroundColor = "#ffe5e5";
            this.participantCount.style.fontWeight = "bold";
            this.participantCount.style.padding = "8px";
            this.participantCount.style.borderRadius = "4px";
          } else {
            this.participantCount.textContent = `✓ ${count}名が入力されています`;
            this.participantCount.style.color = "#667eea";
            this.participantCount.style.backgroundColor = "transparent";
            this.participantCount.style.fontWeight = "normal";
            this.participantCount.style.padding = "0";
          }
        }

        updatePlayerCountOptions() {
          const courtCount = parseInt(this.courtCountSelect.value) || 1;
          const currentValue = this.playerCountSelect.value;
          const helpText = document.getElementById("playerCountHelp");

          // 既存のオプションをクリア
          this.playerCountSelect.innerHTML =
            '<option value="">選択してください</option>';

          let minPlayers;
          let maxPlayers = 30;

          // ダブルス：1コートあたり最低4名
          minPlayers = Math.max(4, courtCount * 4);

          for (let i = minPlayers; i <= maxPlayers; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = `${i}人`;
            this.playerCountSelect.appendChild(option);
          }
          helpText.textContent = `※最低${minPlayers}人（${courtCount}コート×4名）`;

          // 以前選択されていた値が新しいオプションに存在する場合は復元、そうでない場合は最小人数を自動選択
          if (
            currentValue &&
            this.playerCountSelect.querySelector(
              `option[value="${currentValue}"]`
            )
          ) {
            this.playerCountSelect.value = currentValue;
          } else {
            // 最小人数を自動選択
            this.playerCountSelect.value = minPlayers;
          }
        }

        showError(message) {
          this.errorMessage.textContent = message;
          this.errorMessage.classList.add("show");
          setTimeout(() => {
            this.errorMessage.classList.remove("show");
          }, 5000);
        }

        showLoading(show) {
          if (show) {
            this.loading.classList.add("show");
            this.generateBtn.disabled = true;
          } else {
            this.loading.classList.remove("show");
            this.generateBtn.disabled = false;
          }
        }

        formatParticipants() {
          const text = this.participantsInput.value;
          if (!text.trim()) {
            this.showError("整形する名前を入力してください");
            return;
          }

          // 1. 改行、タブ、カンマ、スペース（全角・半角）で分割
          const separators = /[\n\r\t,、\s　]+/;
          let names = text
            .split(separators)
            .map((name) => name.trim())
            .filter((name) => name.length > 0);

          // 2. 各名前から先頭の番号を削除
          //    パターン: "1." "1)" "1 " "①" など
          names = names
            .map((name) => {
              // 半角数字 + 区切り文字（. ) : など）を削除
              let formatted = name.replace(/^\d+[.):：)）]\s*/, "");
              // 全角数字 + 区切り文字を削除
              formatted = formatted.replace(/^[０-９]+[.):：)）]\s*/, "");
              // 丸数字を削除（①②③...）
              formatted = formatted.replace(/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]\s*/, "");
              // 括弧付き数字を削除（(1) (2) ...）
              formatted = formatted.replace(/^\(\d+\)\s*/, "");
              formatted = formatted.replace(/^（\d+）\s*/, "");
              return formatted.trim();
            })
            .filter((name) => name.length > 0);

          // 3. 重複を削除
          names = [...new Set(names)];

          // 4. 整形結果をテキストエリアに反映
          this.participantsInput.value = names.join("\n");

          // 参加者数を更新
          this.updateParticipantCount();

          // 5. 成功メッセージ（エラーメッセージの代わりに使用）
          const originalError = this.errorMessage.style.backgroundColor;
          this.errorMessage.style.backgroundColor = "#e8f5e9";
          this.errorMessage.style.color = "#2e7d32";
          this.errorMessage.textContent = `✓ ${names.length}名の名前を整形しました`;
          this.errorMessage.classList.add("show");
          setTimeout(() => {
            this.errorMessage.classList.remove("show");
            setTimeout(() => {
              this.errorMessage.style.backgroundColor = originalError;
              this.errorMessage.style.color = "#c33";
            }, 300);
          }, 2000);
        }

        randomizeParticipants() {
          const text = this.participantsInput.value;
          if (!text.trim()) {
            this.showError("ランダムにする名前を入力してください");
            return;
          }

          // 名前を取得
          let names = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line.length > 0);

          if (names.length < 2) {
            this.showError("ランダムにするには2名以上必要です");
            return;
          }

          // Fisher-Yates シャッフルアルゴリズム
          for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
          }

          // ランダム順をテキストエリアに反映
          this.participantsInput.value = names.join("\n");

          // 参加者数を更新
          this.updateParticipantCount();

          // 成功メッセージ
          const originalError = this.errorMessage.style.backgroundColor;
          this.errorMessage.style.backgroundColor = "#e8f5e9";
          this.errorMessage.style.color = "#2e7d32";
          this.errorMessage.textContent = `✓ ${names.length}名をランダム順に並べ替えました`;
          this.errorMessage.classList.add("show");
          setTimeout(() => {
            this.errorMessage.classList.remove("show");
            setTimeout(() => {
              this.errorMessage.style.backgroundColor = originalError;
              this.errorMessage.style.color = "#c33";
            }, 300);
          }, 2000);
        }

        parseParticipants(text, playerCount) {
          const names = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line.length > 0);

          // 参加者名が入力されていない場合は番号のみで生成
          if (names.length === 0) {
            return Array.from({ length: playerCount }, (_, i) => String(i + 1));
          }

          // 入力された名前を使用し、不足分は番号で補完
          if (names.length < playerCount) {
            const remaining = playerCount - names.length;
            for (let i = 0; i < remaining; i++) {
              names.push(String(names.length + 1));
            }
          }

          // 全ての名前に番号を付ける
          return names.slice(0, playerCount).map((name, index) => {
            // 既に番号のみの場合はそのまま返す
            if (/^\d+$/.test(name)) {
              return name;
            }
            // 名前がある場合は番号を付けて返す
            return `${index + 1}. ${name}`;
          });
        }

        getMatchType() {
          return "doubles";
        }

        async generateRotation() {
          const title = this.titleInput.value.trim();
          const playerCount = parseInt(this.playerCountSelect.value);
          const courtCount = parseInt(this.courtCountSelect.value);
          const roundCount = parseInt(this.roundCountSelect.value);
          const participantsText = this.participantsInput.value;

          if (!playerCount) {
            this.showError("参加人数を選択してください");
            return;
          }

          if (!courtCount) {
            this.showError("コート数を選択してください");
            return;
          }

          // 参加者名を取得（未入力の場合は番号で自動生成）
          const participants = this.parseParticipants(
            participantsText,
            playerCount
          );

          // 参加者名の数チェックはupdateParticipantCountで実施済み

          if (playerCount < 4) {
            this.showError("ダブルスには最低4人必要です");
            return;
          }

          this.showLoading(true);

          await new Promise((resolve) => setTimeout(resolve, 500));

          try {
            const rotation = new RotationGenerator(
              participants,
              courtCount,
              "doubles",
              roundCount
            );
            this.currentCanvas = new RotationCanvas(rotation, title, "doubles");
            this.currentCanvas.draw();

            this.resultSection.classList.add("show");

            setTimeout(() => {
              this.resultSection.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
              });
            }, 100);
          } catch (error) {
            this.showError(
              "ローテーション表の生成中にエラーが発生しました: " + error.message
            );
            console.error(error);
          } finally {
            this.showLoading(false);
          }
        }

        async downloadImage() {
          if (!this.currentCanvas) return;

          try {
            const dataURL = this.currentCanvas.toDataURL();
            const link = document.createElement("a");
            const fileName = `rotation_${Date.now()}.png`;

            link.download = fileName;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } catch (error) {
            this.showError("画像の保存中にエラーが発生しました");
            console.error(error);
          }
        }

        resetForm() {
          this.form.reset();
          this.resultSection.classList.remove("show");
          this.currentCanvas = null;
          this.updatePlayerCountOptions(); // フォームリセット時に参加人数オプションを再設定
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      // アプリケーション初期化
      document.addEventListener("DOMContentLoaded", () => {
        new UIController();
      });
    </script>
  </body>
</html>
